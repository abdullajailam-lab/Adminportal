<div id="app"></div>
<nav><div id="nav"></div></nav>
<div id="sheet"></div>
<div id="toast" role="status"></div>
<div id="gate" class="sp"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TH={raajje:["#0E6B4F","#084A37","#C8102E","Raajje"],ocean:["#1457B8","#0B3A80","#F59E0B","Ocean"],midnight:["#334155","#0F172A","#38BDF8","Midnight"],plum:["#6B2D5C","#431A39","#F28C38","Plum"]};
const ISL=["Malé","Hulhumalé","Villingili","Thilafushi","Gulhi","Maafushi","Guraidhoo","Thulusdhoo","Dhiffushi","Ukulhas","Rasdhoo"];
const FARE={"Hulhumalé":10,"Villingili":10,"Thilafushi":15,"Gulhi":25,"Maafushi":30,"Guraidhoo":40,"Thulusdhoo":35,"Dhiffushi":35,"Ukulhas":60,"Rasdhoo":70};
const TIMES=[390,480,615,765,930,1035,1140],SPT=[360,420,480,540,600,660,720,780,840,900,960,1020,1080,1140,1200];
let S={tab:"home",mode:"ferry",f:"Malé",t:"Maafushi",day:0,n:1,res:false,name:"Guest",bal:250,theme:"raajje",tix:[]},cur={};
try{Object.assign(S,JSON.parse(localStorage.getItem("fl_s")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("fl_s",JSON.stringify({name:S.name,bal:S.bal,theme:S.theme,tix:S.tix}))}catch(e){}};
const applyTheme=()=>{};
const P={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',book:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',tix:'<path d="M3 8a2 2 0 0 0 0 4a2 2 0 0 1 0 4v2h18v-2a2 2 0 0 1 0-4a2 2 0 0 0 0-4V6H3z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/>',swap:'<path d="M7 4v14M3 14l4 4 4-4M17 20V6M13 10l4-4 4 4"/>',live:'<circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',fare:'<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',back:'<path d="M15 5l-7 7 7 7"/>',check:'<path d="M5 12l5 5L20 7"/>'};
const ic=(n,s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const fare0=(a,b)=>a==="Malé"||b==="Malé"?FARE[a==="Malé"?b:a]||20:Math.abs((FARE[a]||20)-(FARE[b]||20))+15;const fare=(a,b)=>Math.round(fare0(a,b)*2.2/5)*5;
const dur=(a,b)=>Math.max(15,Math.round((Math.round(fare0(a,b)*1.4)+10)*.5)),pad=n=>String(n).padStart(2,"0"),hm=m=>pad(Math.floor(m/60)%24)+":"+pad(m%60);
const dayLabel=d=>{const x=new Date();x.setDate(x.getDate()+d);return x.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})};
const deps=()=>{const n=new Date(),m=n.getHours()*60+n.getMinutes(),sp=true,du=dur(S.f,S.t),fa=fare(S.f,S.t),T=SPT;return T.map((t,i)=>({t,dep:hm(t),arr:hm(t+du),du,fare:fa,sp,vessel:sp?["Speed 1","Speed 2","Speed 3"][i%3]:["Dhoni 04","Dhoni 07","Falhu Star"][i%3],dock:sp?4:i%3+1,seats:sp?(i*5+2)%6+3:(i*7+3)%9+4,late:!sp&&i===3})).filter(d=>S.day||d.t>m)};
const opts=v=>ISL.map(i=>`<option${i===v?" selected":""}>${i}</option>`).join("");
const sheet=h=>{$("#sheet").innerHTML=h?`<div class="sheet" onclick="if(event.target===this)sheet()"><div>${h}</div></div>`:""};
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove("on"),2400)};
const tkt=(x,i,full)=>`<div class="card tk"><div class="th"><div><small>${x.day}${x.sp?" · Speedboat":""}</small><b>${x.from} to ${x.to}</b></div><span class="pill w ${st(x)?"":"pe"}">${st(x)?"Confirmed":"Pending"}</span></div><div class="tb"><div class="ph0" style="margin-bottom:14px">${art(x.sp)}</div><div class="kv2"><div><small>Departs</small><b>${x.dep}</b></div><div><small>Arrives</small><b>${x.arr}</b></div><div><small>Vessel</small><b>${x.vessel}</b></div><div><small>Seats</small><b>${(x.seats||[]).join(", ")||x.n+" pax"}</b></div></div><div class="dash"></div><div class="row"><div><small>Booking ref</small><b>${x.ref}</b><small>${st(x)?"Paid":"Slip received"} · MVR ${x.total}</small></div><div class="qr" role="img" aria-label="Ticket code"></div></div>${st(x)?"":`<div class="note" style="margin-top:14px"><small>We are checking your payment slip. This usually takes a few minutes.</small></div>`}${full?`<div class="acts"><button class="btn s" onclick="saveTicket(${i})">Save</button><button class="btn sec s" onclick="emailTicket(${i})">Email</button></div><div class="acts" style="margin-top:8px"><button class="btn sec s" onclick="go('track')">Track</button><button class="btn sec s" onclick="askCancel(${i})">Cancel</button></div>`:""}</div></div>`;
const home=()=>{const h=new Date().getHours(),g=h<12?"Good morning":h<18?"Good afternoon":"Good evening",u=S.tix[0];
return `<div class="hdr"><div><small>${g}</small><h1>${esc(S.name)}</h1></div><button class="ib" aria-label="Notices" onclick="notices()">${ic("bell",22)}</button></div>
<div class="wal"><div><small>Plan your trip</small><div class="amt">Where to today?</div></div><button class="tu" onclick="go('book')">Book now</button></div>
<div class="qa">${[["book","Book","go('book')"],["tix","Tickets","go('tix')"],["live","Live","go('track')"],["fare","Fares","fares()"]].map(a=>`<button onclick="${a[2]}"><i>${ic(a[0])}</i>${a[1]}</button>`).join("")}</div>
<div class="note"><b>All routes running</b><small>One delay today: 12:45 to Maafushi, 10 min.</small></div>
${u?`<h2>Next trip</h2>${tkt(u,0,0)}`:""}
<h2>Popular routes</h2><div class="card list">${["Hulhumalé","Maafushi","Thulusdhoo","Rasdhoo"].map(n=>`<button class="li" onclick="quick('${n}')"><span><b>${n}</b><small>From Malé · about ${dur("Malé",n)} min</small></span><em>MVR ${fare("Malé",n)}</em>${ic("back",18)}</button>`).join("")}</div>`};
const book=()=>{let r="";if(S.res){if(S.f===S.t)r=`<div class="empty">Choose two different islands.</div>`;else{const d=deps();r=`<h2>${S.f} to ${S.t}</h2>`+(d.length?d.map((x,i)=>`<div class="card rs"><div class="ph0">${art(x.sp)}</div><div><b class="tm">${x.dep} <span>to</span> ${x.arr}</b><small>${x.sp?"Speedboat · ":""}${x.du} min · ${x.vessel} · Dock ${x.dock}</small><span class="pill ${x.late?"late":""}">${x.late?"Delayed 10 min":x.seats+" seats left"}</span></div><div class="pr"><b>MVR ${x.fare*S.n}</b><button class="btn s" onclick="pick(${i})">Select</button></div></div>`).join(""):`<div class="empty">No more ferries today. Try tomorrow.</div>`)}}
return `<h1 class="pg">Book a speedboat</h1><div class="card form"><label>From<select onchange="S.f=this.value;S.res=false;render()">${opts(S.f)}</select></label><button class="sw" aria-label="Swap islands" onclick="[S.f,S.t]=[S.t,S.f];render()">${ic("swap",20)}</button><label>To<select onchange="S.t=this.value;S.res=false;render()">${opts(S.t)}</select></label><div class="seg">${[0,1].map(d=>`<button class="${S.day===d?"on":""}" onclick="S.day=${d};S.res=false;render()">${d?"Tomorrow":"Today"}<small>${dayLabel(d)}</small></button>`).join("")}</div><div class="row"><span>Passengers</span><div class="qty"><button aria-label="Fewer" onclick="S.n=Math.max(1,S.n-1);render()">−</button><b>${S.n}</b><button aria-label="More" onclick="S.n=Math.min(8,S.n+1);render()">+</button></div></div><button class="btn" onclick="S.res=true;render()">Search speedboats</button></div>${r}`};
const tix=()=>`<h1 class="pg">My tickets</h1>`+(S.tix.length?S.tix.map((x,i)=>tkt(x,i,1)).join(""):`<div class="card empty">No tickets yet.<button class="btn" onclick="go('book')">Book a ferry</button></div>`);
const track=()=>{const x=S.tix[0]||{from:"Malé",to:"Maafushi",dep:"08:00",arr:"08:38",vessel:"Dhoni 07"};
return `<button class="bk" onclick="go('tix')">${ic("back",20)}Tickets</button><h1 class="pg">Live ferry</h1><div class="card map"><svg viewBox="0 0 340 190" role="img" aria-label="Ferry position"><path id="rp" d="M40 150C90 60 150 180 205 110S280 50 302 44" fill="none" stroke="var(--line)" stroke-width="5" stroke-linecap="round"/><path id="rd" d="M40 150C90 60 150 180 205 110S280 50 302 44" fill="none" stroke="var(--p)" stroke-width="5" stroke-linecap="round"/><circle cx="40" cy="150" r="9" fill="var(--p2)"/><circle cx="302" cy="44" r="9" fill="var(--a)"/><g id="bt"><circle r="13" fill="var(--card)" stroke="var(--p)" stroke-width="3"/><path d="M-6 3h12l-2 4h-8zM0-7v9M0-6c4 2 5 5 5 8H0z" fill="var(--p)"/></g></svg><div class="tl"><div class="d"><i></i><span><b>${x.dep}</b> Departed ${x.from}</span></div><div class="d"><i></i><span><b>Underway</b> ${x.vessel}, on time</span></div><div><i></i><span><b>${x.arr}</b> Arrives ${x.to}</span></div></div><small>Sample position for this prototype.</small></div>`};
const prof=()=>`<h1 class="pg">Profile</h1><div class="card ph"><div class="av">${esc((S.name.trim()[0]||"G").toUpperCase())}</div><label>Your name<input value="${esc(S.name)}" maxlength="24" onchange="S.name=this.value.trim()||'Guest';save();render()"></label></div><h2>Security</h2><div class="card list"><button class="li" onclick="resetPin()"><span><b>Change PIN</b><small>Set a new 4-digit PIN</small></span>${ic("back",18)}</button></div><p class="mute c">Falhu 1.0 · Sample schedules and fares</p>`;
function navR(){const T=[["home","Home"],["book","Book"],["tix","Tickets"],["prof","Profile"]],a=S.tab==="track"?"tix":S.tab;$("#nav").innerHTML=T.map(t=>`<button class="${a===t[0]?"on":""}" onclick="go('${t[0]}')">${ic(t[0]==="prof"?"user":t[0])}${t[1]}</button>`).join("")}
function render(){navR();$("#app").innerHTML=({home:home3,book,tix,track,prof:prof2})[S.tab]();if(S.tab==="track"){const p=$("#rp"),b=$("#bt"),L=p.getTotalLength(),q=p.getPointAtLength(L*.62);b.setAttribute("transform",`translate(${q.x} ${q.y})`);$("#rd").style.strokeDasharray=`${L*.62} ${L}`}}
function go(t){S.tab=t;render();window.scrollTo(0,0)}
function quick(n){S.f="Malé";S.t=n;S.res=true;go("book")}
function topup(){S.bal+=100;save();render();toast("MVR 100 added to your wallet")}
function notices(){sheet(`<h2>Notices</h2><div class="nt"><b>Service normal</b><small>All ferries are running on schedule today.</small></div><div class="nt"><b>Bookings open</b><small>Upload your payment slip to confirm your seats.</small></div><button class="btn sec" onclick="sheet()">Close</button>`)}
function fares(){sheet(`<h2>Fares from Malé</h2>${Object.keys(FARE).map(n=>`<div class="row nt"><span>${n}</span><b>MVR ${fare("Malé",n)}</b></div>`).join("")}<small style="margin-top:8px">Adult fares, sample data.</small><button class="btn sec" onclick="sheet()">Close</button>`)}
function pick(i){cur={d:deps()[i],pay:"wallet"};review()}
function review(){const d=cur.d,tot=d.fare*S.n,ok=cur.pay!=="wallet"||S.bal>=tot;sheet(`<h2>Review and pay</h2><div class="kv"><span>Route</span><b>${S.f} to ${S.t}</b><span>Date</span><b>${dayLabel(S.day)}</b><span>Departs</span><b>${d.dep}, arrives ${d.arr}</b><span>Vessel</span><b>${d.vessel}, Dock ${d.dock}</b><span>Passengers</span><b>${S.n}</b></div><div class="opts">${[["wallet","Wallet","MVR "+S.bal.toFixed(2)],["card","Card","Sample payment"]].map(o=>`<button class="opt ${cur.pay===o[0]?"on":""}" onclick="cur.pay='${o[0]}';review()"><b>${o[1]}</b><small>${o[2]}</small></button>`).join("")}</div><div class="row tot"><span>Total</span><b>MVR ${tot}</b></div>${ok?"":`<p class="err">Not enough balance. Top up your wallet or use a card.</p>`}<button class="btn" ${ok?"":"disabled"} onclick="pay()">Confirm and pay</button><button class="btn sec" onclick="sheet()">Cancel</button>`)}
function pay(){const d=cur.d,tot=d.fare*S.n;if(cur.pay==="wallet")S.bal-=tot;S.tix.unshift({from:S.f,to:S.t,day:dayLabel(S.day),dep:d.dep,arr:d.arr,vessel:d.vessel,n:S.n,total:tot,ref:"FL"+Math.floor(10000+Math.random()*89999)});save();sheet();S.res=false;go("tix");toast("Booking confirmed")}
function askCancel(i){sheet(`<h2>Cancel this ticket?</h2><p class="mute">MVR ${S.tix[i].total} will be refunded to your wallet.</p><button class="btn" onclick="cancelT(${i})">Yes, cancel ticket</button><button class="btn sec" onclick="sheet()">Keep ticket</button>`)}
function cancelT(i){S.bal+=S.tix[i].total;S.tix.splice(i,1);save();sheet();render();toast("Ticket cancelled and refunded")}
P.up='<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>';
function st(x){return !x.at||Date.now()-x.at>15000}
function pick(i){cur={d:deps()[i],slip:"",err:"",seats:[]};seatScreen()}
function review(){const d=cur.d,tot=d.fare*S.n;sheet(`<h2>Review and pay</h2><div class="kv"><span>Route</span><b>${S.f} to ${S.t}</b><span>Date</span><b>${dayLabel(S.day)}</b><span>Departs</span><b>${d.dep}, arrives ${d.arr}</b><span>Vessel</span><b>${d.vessel}, Dock ${d.dock}</b><span>Passengers</span><b>${S.n}</b><span>Seats</span><b>${(cur.seats||[]).join(", ")}</b><span>Lead passenger</span><b>${esc(ACC?ACC.name:S.name)}</b><span>ID card</span><b>${ACC?esc(ACC.id):"-"}</b></div><div class="bank"><b>Pay by bank transfer</b><div><span>Bank</span><b>Sample Bank</b></div><div><span>Account name</span><b>Falhu Ferry Services</b></div><div><span>Account no.</span><b>7700-000-000</b></div><div><span>Amount</span><b>MVR ${tot}</b></div></div><input id="slip" type="file" accept="image/*" hidden onchange="slipPick(this)"><button class="up" onclick="$('#slip').click()">${cur.slip?`<img src="${cur.slip}" alt="Payment slip preview"><span>Slip added. Tap to replace.</span>`:`${ic("up",22)}<span>Upload payment slip</span>`}</button><small>Take a photo or choose a screenshot of your transfer receipt.</small>${cur.err?`<p class="err">${cur.err}</p>`:""}<button class="btn" ${cur.slip?"":"disabled"} onclick="pay()">Submit booking</button><button class="lnk" onclick="seatScreen()">Change seats</button><button class="btn sec" onclick="sheet()">Cancel</button>`)}
function slipPick(inp){const f=inp.files[0];if(!f)return;if(f.size>12e6){cur.err="File is too large. Choose an image under 12 MB.";return review()}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cur.slip=c.toDataURL("image/jpeg",.6);cur.err="";review()};im.onerror=()=>{cur.err="That file could not be read. Try a photo or screenshot.";review()};im.src=r.result};r.readAsDataURL(f)}
function pay(){const d=cur.d,tot=d.fare*S.n;S.tix.unshift({from:S.f,to:S.t,day:dayLabel(S.day),dep:d.dep,arr:d.arr,vessel:d.vessel,sp:d.sp,seats:cur.seats,n:S.n,total:tot,at:Date.now(),ref:"FL"+Math.floor(10000+Math.random()*89999)});save();sheet();S.res=false;go("tix");doneSheet(0);setTimeout(()=>{if(S.tab==="tix"||S.tab==="home")render();toast("Payment verified")},15500)}
function askCancel(i){sheet(`<h2>Cancel this ticket?</h2><p class="mute">Refunds go back to the account you paid from.</p><button class="btn" onclick="cancelT(${i})">Yes, cancel ticket</button><button class="btn sec" onclick="sheet()">Keep ticket</button>`)}
function cancelT(i){S.tix.splice(i,1);save();sheet();render();toast("Ticket cancelled")}
const home2=()=>{const h=new Date().getHours(),g=h<12?"Good morning":h<18?"Good afternoon":"Good evening",u=S.tix[0];
return `<div class="appbar"><div class="brand"><svg width="30" height="30" viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="19" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-dasharray="22 8 10 8 14 8"/><circle cx="24" cy="24" r="8" stroke="currentColor" stroke-width="4" opacity=".6"/><circle cx="24" cy="24" r="3" fill="currentColor"/></svg>Falhu</div><button class="ib" aria-label="Notices" onclick="notices()">${ic("bell",22)}</button></div>
<div class="gr"><small>${g}</small><h1>${esc(S.name)}</h1></div>
<div class="card srch form"><label>From<select onchange="S.f=this.value;render()">${opts(S.f)}</select></label><button class="sw" aria-label="Swap islands" onclick="[S.f,S.t]=[S.t,S.f];render()">${ic("swap",20)}</button><label>To<select onchange="S.t=this.value;render()">${opts(S.t)}</select></label>${modes(0)}<button class="btn" onclick="S.res=true;go('book')">Find speedboats</button></div>
<div class="qa">${[["tix","Tickets","go('tix')"],["live","Live","go('track')"],["fare","Fares","fares()"],["bell","Alerts","notices()"]].map(a=>`<button onclick="${a[2]}"><i>${ic(a[0])}</i>${a[1]}</button>`).join("")}</div>
<div class="note"><b>All speedboats running</b><small>Good sea conditions on all routes today.</small></div>
${u?`<h2>Next trip</h2>${tkt(u,0,0)}`:""}

const G=$("#gate");let pin="",first="",stage="",saved=null;
try{saved=localStorage.getItem("fl_pin")}catch(e){}
const MARK=s=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="19" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="22 8 10 8 14 8"/><circle cx="24" cy="24" r="8" stroke="#fff" stroke-width="4" opacity=".6"/><circle cx="24" cy="24" r="3" fill="#fff"/></svg>`;
function hash(p){try{return crypto.subtle.digest("SHA-256",new TextEncoder().encode("falhu"+p)).then(b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join(""))}catch(e){return Promise.resolve("p"+p)}}
function splash(){G.className="sp";G.innerHTML=`<div class="cen">${MARK(104)}<h1 class="big">Falhu</h1><p>Island to island</p></div>`}
function loader(){G.className="light";G.innerHTML=`<div class="spin"><i></i><i></i><i></i></div><p class="pw">Please wait ...</p>`}
const msgFor=()=>stage==="enter"?"Enter your PIN":stage==="confirm"?"Confirm your PIN":"Set your PIN code";
function pinUI(msg,bad){G.className="sp";const d=[0,1,2,3].map(i=>`<b class="${i<pin.length?"f":""}"></b>`).join(""),k=[1,2,3,4,5,6,7,8,9,"s",0,"x"].map(n=>n==="s"?(stage==="enter"?`<button class="t" onclick="loginScreen()">PASSWORD</button>`:`<button class="t" onclick="openApp()">SKIP</button>`):n==="x"?`<button class="t" aria-label="Delete" onclick="key('x')">⌫</button>`:`<button onclick="key(${n})">${n}</button>`).join("");G.innerHTML=`${MARK(58)}<div class="pt">${msg}</div><div class="dots${bad?" bad":""}">${d}</div><div class="pad">${k}</div>`}
function key(n){if(G.style.display==="none"||!stage)return;if(n==="x"){pin=pin.slice(0,-1);return pinUI(msgFor())}if(pin.length>=4)return;pin+=n;pinUI(msgFor());if(pin.length<4)return;setTimeout(()=>{const p=pin;pin="";if(stage==="set"){first=p;stage="confirm";pinUI(msgFor())}else if(stage==="confirm"){if(p===first)hash(p).then(h=>{saved=h;try{localStorage.setItem("fl_pin",h)}catch(e){}openApp()});else{stage="set";first="";pinUI("PINs did not match. Set it again.",1)}}else hash(p).then(h=>h===saved?openApp():pinUI("Wrong PIN. Try again.",1))},180)}
function openApp(){stage="";G.classList.add("out");setTimeout(()=>{G.style.display="none"},400)}
function resetPin(){try{localStorage.removeItem("fl_pin")}catch(e){}saved=null;pin="";first="";stage="set";G.style.display="flex";G.classList.remove("out");pinUI(msgFor())}
document.addEventListener("keydown",e=>{if(/^[0-9]$/.test(e.key))key(+e.key);else if(e.key==="Backspace")key("x")});
var ACC=null,R={},ph={};
try{ACC=JSON.parse(localStorage.getItem("fl_acct")||"null")}catch(e){}
if(ACC)S.name=ACC.name;
function saveAcc(){try{localStorage.setItem("fl_acct",JSON.stringify(ACC))}catch(e){toast("Could not save photos. Try smaller images.")}}
function show(h,c){stage="";G.style.display="flex";G.className=c;G.innerHTML=h;G.scrollTop=0}
function fmWrap(step,title,sub,body,back){return `<div class="fm form">${back?`<button class="bk" onclick="${back}">${ic("back",20)}Back</button>`:""}${step?`<div class="stp">${[1,2,3].map(i=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div>`:""}<h1 class="pg">${title}</h1><p class="mute sb">${sub}</p>${body}</div>`}
function welcome(){show(`<div class="cen">${MARK(88)}<h1 class="big">Falhu</h1><p>Island to island</p></div><div class="wb"><button class="btn wh" onclick="reg1()">Create account</button><button class="btn ol" onclick="loginScreen()">Sign in</button></div>`,"sp")}
