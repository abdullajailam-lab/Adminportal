<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Milandhoo eFootball Community</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#04060c;
    --bg-2:#0a0f1a;
    --surface:#0f1624;
    --surface-2:#172033;
    --surface-3:#1f2a42;
    --border:#222d45;
    --border-2:#2f3d5c;
    --text:#eaf0f9;
    --text-2:#b8c4d9;
    --muted:#7583a0;
    --accent:#ff6b35;
    --accent-2:#ff8c42;
    --accent-glow:rgba(255,107,53,0.4);
    --cyan:#00d4ff;
    --cyan-glow:rgba(0,212,255,0.3);
    --success:#10d47a;
    --warning:#f5b30b;
    --danger:#ef4444;
    --radius:12px;
    --radius-sm:8px;
    --shadow:0 12px 36px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(1200px 600px at 90% -10%, rgba(255,107,53,0.09), transparent 60%),radial-gradient(900px 500px at -10% 40%, rgba(0,212,255,0.06), transparent 60%)}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;color:inherit}

  .logo-svg{width:100%;height:100%;display:block}

  .app{display:flex;min-height:100vh;position:relative;z-index:1}
  .sidebar{width:250px;background:rgba(10,15,26,0.95);backdrop-filter:blur(14px);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;z-index:50;display:flex;flex-direction:column;padding:24px 16px}
  .brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px;border-bottom:1px solid var(--border);margin-bottom:16px}
  .brand-logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#ff6b35 0%,#ff8c42 50%,#00d4ff 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px var(--accent-glow);flex-shrink:0}
  .brand-name{font-family:'Rajdhani';font-weight:700;font-size:17px;line-height:1.1;letter-spacing:0.5px}
  .brand-sub{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:3px;font-weight:600}
  .nav{display:flex;flex-direction:column;gap:3px;flex:1}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;color:var(--text-2);font-weight:500;font-size:14px;transition:all .2s;border-left:2px solid transparent}
  .nav-item:hover{background:var(--surface);color:var(--text)}
  .nav-item.active{background:linear-gradient(90deg,rgba(255,107,53,0.15),transparent);color:var(--accent);border-left-color:var(--accent)}
  .nav-item svg{width:18px;height:18px;flex-shrink:0}
  .nav-section{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;padding:14px 13px 6px;font-weight:700}
  .sidebar-foot{padding-top:16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}

  .main{margin-left:250px;flex:1;padding:32px 40px;max-width:100%}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:16px;flex-wrap:wrap}
  .page-title{font-family:'Rajdhani';font-size:30px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase}
  .page-sub{color:var(--muted);font-size:13px;margin-top:4px}
  .top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:600;font-size:13px;transition:all .2s;border:1px solid transparent;letter-spacing:0.3px}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 4px 14px var(--accent-glow)}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 22px var(--accent-glow)}
  .btn-secondary{background:var(--surface);border-color:var(--border);color:var(--text)}
  .btn-secondary:hover{background:var(--surface-2);border-color:var(--accent)}
  .btn-ghost{color:var(--muted);padding:8px 12px}
  .btn-ghost:hover{color:var(--text);background:var(--surface)}
  .btn-danger{background:rgba(239,68,68,0.12);color:var(--danger);border-color:rgba(239,68,68,0.3)}
  .btn-danger:hover{background:rgba(239,68,68,0.2)}
  .btn-cyan{background:linear-gradient(135deg,#00d4ff,#0099cc);color:#060912;box-shadow:0 4px 14px var(--cyan-glow)}
  .btn-success{background:linear-gradient(135deg,var(--success),#0aa866);color:#fff;box-shadow:0 4px 14px rgba(16,212,122,0.3)}
  .btn-sm{padding:6px 12px;font-size:12px}
  .btn-icon{padding:8px;width:36px;height:36px;justify-content:center}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;transition:all .2s}
  .card:hover{border-color:var(--border-2)}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
  .card-title{font-family:'Rajdhani';font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}

  .grid{display:grid;gap:16px}
  .grid-2{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .grid-4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:720px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}}

  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
  .stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--cyan))}
  .stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
  .stat-value{font-family:'Rajdhani';font-size:34px;font-weight:700;margin-top:6px;letter-spacing:0.5px;line-height:1}
  .stat-delta{font-size:12px;color:var(--accent);margin-top:4px;font-weight:500}

  .table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;padding:13px 16px;background:var(--surface-2);color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border)}
  td{padding:13px 16px;border-bottom:1px solid var(--border)}
  tr:last-child td{border-bottom:none}
  tbody tr{transition:background .15s}
  tbody tr:hover{background:rgba(255,255,255,0.02)}

  .form-group{margin-bottom:15px}
  .form-label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
  .form-input,.form-select,.form-textarea{width:100%;padding:11px 14px;background:var(--bg-2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;transition:all .2s}
  .form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .form-textarea{resize:vertical;min-height:80px}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:600px){.form-row,.form-row-3{grid-template-columns:1fr}}

  .badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase}
  .badge-open{background:rgba(16,185,129,0.15);color:var(--success);border:1px solid rgba(16,185,129,0.3)}
  .badge-active{background:rgba(0,212,255,0.15);color:var(--cyan);border:1px solid rgba(0,212,255,0.3)}
  .badge-completed{background:rgba(122,134,153,0.15);color:var(--muted);border:1px solid rgba(122,134,153,0.3)}
  .badge-draft{background:rgba(245,158,11,0.15);color:var(--warning);border:1px solid rgba(245,158,11,0.3)}
  .badge-format{background:rgba(255,107,53,0.12);color:var(--accent);border:1px solid rgba(255,107,53,0.3)}
  .badge-live{background:rgba(239,68,68,0.15);color:var(--danger);border:1px solid rgba(239,68,68,0.3);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}

  .modal-overlay{position:fixed;inset:0;background:rgba(3,6,12,0.85);backdrop-filter:blur(10px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-overlay.show{display:flex;animation:fadeIn .2s}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:580px;max-height:90vh;overflow-y:auto;animation:slideUp .3s}
  .modal-lg{max-width:880px}
  .modal-xl{max-width:1000px}
  .modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .modal-title{font-family:'Rajdhani';font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
  .modal-body{padding:22px 24px}
  .modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

  .player-card{background:linear-gradient(135deg,var(--surface),var(--surface-2));border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden;transition:all .25s}
  .player-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
  .player-avatar{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--cyan));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;margin-bottom:12px;font-family:'Rajdhani';box-shadow:0 4px 14px var(--accent-glow);overflow:hidden;flex-shrink:0}
  .player-avatar img{width:100%;height:100%;object-fit:cover}
  .player-name{font-family:'Rajdhani';font-size:18px;font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px}
  .player-meta{font-size:12px;color:var(--muted);margin-bottom:12px}
  .player-stats{display:flex;gap:16px;padding-top:12px;border-top:1px solid var(--border)}
  .player-stat-val{font-family:'Rajdhani';font-size:20px;font-weight:700;line-height:1}
  .player-stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-top:2px}

  .tourney-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
  .tourney-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
  .tourney-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--cyan));transform:scaleX(0);transform-origin:left;transition:transform .3s}
  .tourney-card:hover::after{transform:scaleX(1)}
  .tourney-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px}
  .tourney-name{font-family:'Rajdhani';font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;line-height:1.2}
  .tourney-date{font-size:12px;color:var(--muted);margin-top:4px}
  .tourney-stats{display:flex;gap:18px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
  .tourney-stat{flex:1}
  .tourney-stat-val{font-family:'Rajdhani';font-size:20px;font-weight:700;line-height:1}
  .tourney-stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-top:2px}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto}
  .tab{padding:12px 18px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;transition:all .2s;white-space:nowrap;text-transform:uppercase;letter-spacing:0.5px}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}

  .group-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
  .group-title{font-family:'Rajdhani';font-weight:700;font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:10px;text-transform:uppercase;letter-spacing:1px}
  .group-title::before{content:'';width:4px;height:20px;background:linear-gradient(180deg,var(--accent),var(--cyan));border-radius:2px}
  .group-table{width:100%;font-size:13px}
  .group-table th{padding:8px 10px;font-size:10px}
  .group-table td{padding:10px}
  .qualify{background:rgba(16,185,129,0.06)}
  .qualify td:first-child{position:relative}
  .qualify td:first-child::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--success)}

  .bracket{display:flex;gap:36px;overflow-x:auto;padding:20px 0}
  .bracket-round{display:flex;flex-direction:column;justify-content:space-around;min-width:240px;gap:18px}
  .bracket-match{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:13px}
  .bracket-match-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:700}
  .bracket-team{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border)}
  .bracket-team:last-child{border-bottom:none}
  .bracket-team.winner{color:var(--accent);font-weight:700}
  .bracket-team.tbd{color:var(--muted);font-style:italic}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--accent);padding:14px 20px;border-radius:10px;font-size:14px;z-index:200;font-weight:500;box-shadow:var(--shadow);animation:slideIn .3s}
  .toast.error{border-color:var(--danger)}
  @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty-title{font-family:'Rajdhani';font-size:20px;color:var(--text);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}

  .login-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px;width:100%;max-width:420px}
  .login-brand{text-align:center;margin-bottom:28px}
  .login-brand .brand-logo{width:70px;height:70px;margin:0 auto 18px;border-radius:18px}
  .login-brand h1{font-family:'Rajdhani';font-size:26px;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
  .login-brand p{color:var(--muted);font-size:13px}

  .mobile-toggle{display:none;position:fixed;top:16px;left:16px;z-index:60;background:var(--surface);border:1px solid var(--border);padding:8px;border-radius:8px}
  @media(max-width:900px){
    .sidebar{transform:translateX(-100%);transition:transform .3s}
    .sidebar.open{transform:translateX(0)}
    .main{margin-left:0;padding:20px;padding-top:70px}
    .mobile-toggle{display:block}
  }

  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--border-2)}

  .flex{display:flex}
  .flex-between{display:flex;justify-content:space-between;align-items:center}
  .gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
  .mt-16{margin-top:16px}.mt-24{margin-top:24px}.mb-16{margin-bottom:16px}
  .text-muted{color:var(--muted)}
  .text-sm{font-size:13px}
  .text-xs{font-size:11px}
  .hidden{display:none !important}
  .text-accent{color:var(--accent)}
  .text-cyan{color:var(--cyan)}

  .prize-card{background:linear-gradient(135deg,var(--surface),var(--surface-2));border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;position:relative;overflow:hidden}
  .prize-card.gold{border-color:rgba(255,215,0,0.4);background:linear-gradient(135deg,rgba(255,215,0,0.08),var(--surface))}
  .prize-card.silver{border-color:rgba(192,192,192,0.3);background:linear-gradient(135deg,rgba(192,192,192,0.06),var(--surface))}
  .prize-card.bronze{border-color:rgba(205,127,50,0.3);background:linear-gradient(135deg,rgba(205,127,50,0.06),var(--surface))}
  .prize-icon{font-size:32px;margin-bottom:6px}
  .prize-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
  .prize-value{font-family:'Rajdhani';font-size:22px;font-weight:700;margin-top:4px}
  .prize-winner{font-size:12px;color:var(--accent);margin-top:4px;font-weight:600}

  .rank-badge{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-weight:700;font-size:12px;font-family:'Rajdhani'}
  .rank-1{background:linear-gradient(135deg,#ffd700,#ff9500);color:#060912;box-shadow:0 4px 12px rgba(255,215,0,0.3)}
  .rank-2{background:linear-gradient(135deg,#c0c0c0,#8a8a8a);color:#060912}
  .rank-3{background:linear-gradient(135deg,#cd7f32,#8b4513);color:#fff}
  .rank-other{background:var(--surface-2);color:var(--muted)}

  .admin-indicator{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;background:rgba(255,107,53,0.12);color:var(--accent);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;border:1px solid rgba(255,107,53,0.3)}
  .admin-indicator::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}

  .countdown-card{background:linear-gradient(135deg,rgba(255,107,53,0.12),rgba(0,212,255,0.08));border:1px solid var(--border-2);border-radius:var(--radius);padding:24px;text-align:center;position:relative;overflow:hidden;margin-bottom:20px}
  .countdown-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%, rgba(255,107,53,0.2), transparent 60%);pointer-events:none}
  .countdown-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-bottom:10px}
  .countdown-timer{display:flex;justify-content:center;gap:14px;margin:14px 0}
  .countdown-unit{background:var(--surface-2);border:1px solid var(--border-2);border-radius:10px;padding:12px 16px;min-width:70px}
  .countdown-num{font-family:'Rajdhani';font-size:32px;font-weight:700;color:var(--accent);line-height:1}
  .countdown-txt{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:4px;font-weight:700}
  .countdown-status{font-family:'Rajdhani';font-size:18px;font-weight:700;margin-top:8px;text-transform:uppercase;letter-spacing:1px}
  .countdown-status.live{color:var(--danger);animation:pulse 1.5s infinite}
  .countdown-status.upcoming{color:var(--cyan)}
  .countdown-status.ended{color:var(--muted)}

  .player-check-list{max-height:380px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;background:var(--bg-2)}
  .player-check-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
  .player-check-item:last-child{border-bottom:none}
  .player-check-item:hover{background:var(--surface)}
  .player-check-item.selected{background:rgba(255,107,53,0.08)}
  .player-check-item input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
  .player-check-item .player-avatar{width:34px;height:34px;font-size:14px;margin:0}
  .player-check-item .info{flex:1;min-width:0}
  .player-check-item .info .name{font-weight:600;font-size:14px}
  .player-check-item .info .meta{font-size:11px;color:var(--muted)}

  .fixture-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
  .fixture-stage{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;min-width:80px}
  .fixture-teams{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,9) }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) }
function fmtDateTime(d){
  if(!d) return '—';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) + ' · ' + dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function isAdmin(){ return !!DB.get('session') }

/* =========================
   AUTO-CALCULATE STATS
   ========================= */
function calculateAllStats(){
  const players = DB.get('players');
  const tournaments = DB.get('tournaments');
  const stats = {};
  players.forEach(p=>{
    stats[p.id] = {matches:0, wins:0, draws:0, losses:0, gf:0, ga:0, tourneyWins:0, tourneyRunnerUp:0, tourneyThird:0, achievements:[]};
  });

  tournaments.forEach(t=>{
    if(t.groupData){
      t.groupData.forEach(g=>{
        g.players.forEach(row=>{
          if(stats[row.playerId]){
            stats[row.playerId].matches += row.played;
            stats[row.playerId].wins += row.wins;
            stats[row.playerId].draws += row.draws;
            stats[row.playerId].losses += row.losses;
            stats[row.playerId].gf += row.gf;
            stats[row.playerId].ga += row.ga;
          }
        });
      });
    }
    if(t.knockoutBracket){
      t.knockoutBracket.forEach(round=>{
        round.forEach(m=>{
          if(m.score1!==null && m.score1!==undefined && m.score2!==null && m.score2!==undefined){
            if(stats[m.team1]) stats[m.team1].matches += 1;
            if(stats[m.team2]) stats[m.team2].matches += 1;
            if(m.winner===m.team1 && stats[m.team1]) stats[m.team1].wins += 1;
            else if(m.winner===m.team2 && stats[m.team2]) stats[m.team2].wins += 1;
          }
        });
      });
    }
    if(t.status==='completed'){
      if(t.champion && stats[t.champion]){ stats[t.champion].tourneyWins += 1; stats[t.champion].achievements.push(`🏆 Champion · ${t.name}`); }
      if(t.runnerUp && stats[t.runnerUp]){ stats[t.runnerUp].tourneyRunnerUp += 1; stats[t.runnerUp].achievements.push(`🥈 Runner-up · ${t.name}`); }
      if(t.thirdPlace && stats[t.thirdPlace]){ stats[t.thirdPlace].tourneyThird += 1; stats[t.thirdPlace].achievements.push(`🥉 Third Place · ${t.name}`); }
    }
  });

  Object.values(stats).forEach(s=>{
    s.winPct = s.matches ? ((s.wins/s.matches)*100).toFixed(1) : '0.0';
  });
  return stats;
}

function formatLabel(f){
  return {group_knockout:'Group + Knockout', league:'League', single_elimination:'Single Elimination'}[f] || f;
}

function navigate(view, param){

/* =========================
   TOAST & MODAL
   ========================= */
function toast(msg, err=false){
  const t = document.createElement('div');
  t.className = 'toast' + (err?' error':'');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}
function openModal(html, size='md'){
  const m = document.getElementById('modal');
  const sizeClass = size==='lg'?'modal-lg':size==='xl'?'modal-xl':'';
  m.innerHTML = `<div class="modal ${sizeClass}">${html}</div>`;
  m.classList.add('show');
  m.onclick = (e)=>{ if(e.target===m) closeModal() }
}
function closeModal(){ document.getElementById('modal').classList.remove('show') }

/* =========================
   COUNTDOWN TIMER
   ========================= */
function startCountdown(targetDateTime, elementId){
  if(countdownInterval) clearInterval(countdownInterval);
  const target = new Date(targetDateTime).getTime();

  function update(){
    const el = document.getElementById(elementId);
    if(!el) { clearInterval(countdownInterval); return; }
    const now = Date.now();
    const diff = target - now;

    if(diff > 0){
      const days = Math.floor(diff / (1000*60*60*24));
      const hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
      const mins = Math.floor((diff % (1000*60*60)) / (1000*60));
      const secs = Math.floor((diff % (1000*60)) / 1000);
      el.innerHTML = `
        <div class="countdown-timer">
          <div class="countdown-unit"><div class="countdown-num">${days}</div><div class="countdown-txt">Days</div></div>
          <div class="countdown-unit"><div class="countdown-num">${String(hours).padStart(2,'0')}</div><div class="countdown-txt">Hours</div></div>
          <div class="countdown-unit"><div class="countdown-num">${String(mins).padStart(2,'0')}</div><div class="countdown-txt">Minutes</div></div>
          <div class="countdown-unit"><div class="countdown-num">${String(secs).padStart(2,'0')}</div><div class="countdown-txt">Seconds</div></div>
        </div>
        <div class="countdown-status upcoming">⏱ Starts in</div>
      `;
    } else {
      const elapsed = -diff;
      const hours = Math.floor(elapsed/(1000*60*60));
      const mins = Math.floor((elapsed%(1000*60*60))/(1000*60));
      el.innerHTML = `
        <div class="countdown-timer">
          <div class="countdown-unit"><div class="countdown-num" style="color:var(--danger)">🔴</div><div class="countdown-txt">Live</div></div>
          <div class="countdown-unit"><div class="countdown-num">${hours}</div><div class="countdown-txt">Hours</div></div>
          <div class="countdown-unit"><div class="countdown-num">${String(mins).padStart(2,'0')}</div><div class="countdown-txt">Minutes</div></div>
        </div>
        <div class="countdown-status live">● Tournament Live Now</div>
      `;
    }
  }
  update();
  countdownInterval = setInterval(update, 1000);
}

/* =========================
   EXPORT AS JPEG
   ========================= */
async function exportAsJPEG(elementId, filename){
  const el = document.getElementById(elementId);
  if(!el){ toast('Nothing to export', true); return }
  toast('Generating image...');
  try{
    const canvas = await html2canvas(el, {backgroundColor: '#04060c', scale: 2, useCORS: true, logging: false});
    const link = document.createElement('a');
    link.download = `${filename}.jpeg`;
    link.href = canvas.toDataURL('image/jpeg', 0.95);
    link.click();
    toast('Image downloaded');
  } catch(e){ console.error(e); toast('Export failed', true); }
}

/* =========================
   FLEXIBLE GROUP DISTRIBUTION
   ========================= */
function distributePlayersToGroups(playerCount, numGroups){
  if(numGroups < 1) numGroups = 1;
  if(playerCount < numGroups) numGroups = playerCount;
  const baseSize = Math.floor(playerCount / numGroups);
  const remainder = playerCount % numGroups;
  const groups = [];
  for(let i=0;i<numGroups;i++){
    groups.push(i < remainder ? baseSize + 1 : baseSize);
  }
  return groups;
}

function nextPow2(n){ let p=1; while(p<n) p*=2; return p; }

/* =========================
   PHOTO UPLOAD (resize to thumbnail)
   ========================= */
function handlePhotoUpload(inputEl, previewEl, callback){
  const file = inputEl.files[0];
  if(!file){ return }
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      // Resize to 200x200 thumbnail
      const canvas = document.createElement('canvas');
      const size = 200;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      // Crop to square from center
      const min = Math.min(img.width, img.height);
      const sx = (img.width - min) / 2;
      const sy = (img.height - min) / 2;
      ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      previewEl.innerHTML = `<img src="${dataUrl}" alt="preview">`;
      callback(dataUrl);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderAvatar(player, size=54){

  }
  return `<div class="player-avatar" style="width:${size}px;height:${size}px;font-size:${size*0.37}px">${player.name.charAt(0)}</div>`;
}

    </div>

    <div class="grid grid-2 mt-24">
      <div class="card">

        </div>

          openT.slice(0,3).map(t=>`
            <div class="tourney-card" onclick="navigate('tournament-detail','${t.id}')" style="margin-bottom:12px">
              <div class="tourney-head">
                <div>
                  <div class="tourney-name">${t.name}</div>

function renderTopPlayersList(){
  const players = DB.get('players');
  const stats = calculateAllStats();
  if(players.length===0) return '<div class="empty"><div class="empty-title">No players yet</div></div>';
  const ranked = [...players].map(p=>({p, s:stats[p.id]||{}})).sort((a,b)=> (b.s.tourneyWins-a.s.tourneyWins) || (b.s.wins-a.s.wins));
  return ranked.slice(0,5).map((x,i)=>`
    <div class="flex-between" style="padding:12px 0;border-bottom:1px solid var(--border)">
      <div class="flex gap-12" style="align-items:center">
        <div class="rank-badge ${i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-other'}">${i+1}</div>
        ${renderAvatar(x.p, 36)}
        <div>
          <div style="font-weight:600;font-size:14px">${x.p.name}</div>
          <div class="text-xs text-muted">${x.s.matches||0} matches · ${x.s.winPct||0}% win</div>
        </div>
      </div>
      <div style="text-align:right">
        <div style="font-family:'Rajdhani';font-weight:700;color:var(--accent);font-size:18px">${x.s.wins||0}W</div>
        ${x.s.tourneyWins>0?`<div class="text-xs text-accent">🏆 ${x.s.tourneyWins}</div>`:''}
      </div>
    </div>
  `).join('');
}

function savePlayer(id){
  const name = document.getElementById('p_name').value.trim();
  if(!name){ toast('Player name is required', true); return }
  const players = DB.get('players');
  const photo = window._tempPhoto;
  if(id){
    const idx = players.findIndex(p=>p.id===id);
    players[idx] = {...players[idx], name, photo};
  } else {
    players.push({id:uid(), name, photo});
  }
  DB.set('players', players);
  window._tempPhoto = null;
  closeModal();
  renderPlayers();
  toast('Player saved');
}

function deletePlayer(id){
  if(!confirm('Delete this player? This cannot be undone.')) return;
  DB.set('players', DB.get('players').filter(p=>p.id!==id));
  renderPlayers();
  toast('Player deleted');
}

// Cache stats for player list rendering
const stats_cache = (()=>{
  const s = calculateAllStats();
  return s;
})();

function toggleAllCreateChecks(state){
  document.querySelectorAll('#createPlayerList input[type="checkbox"]').forEach(cb=>{
    cb.checked = state;
    cb.closest('.player-check-item').classList.toggle('selected', state);
  });
  updateCreateSelection();
}

function updateCreateSelection(){
  document.querySelectorAll('#createPlayerList .player-check-item').forEach(item=>{
    const cb = item.querySelector('input[type="checkbox"]');
    item.classList.toggle('selected', cb.checked);
  });
  const checked = document.querySelectorAll('#createPlayerList input[type="checkbox"]:checked');
  const el = document.getElementById('createSelectionSummary');
  if(el) el.innerHTML = `<strong>Selected:</strong> ${checked.length} player${checked.length!==1?'s':''}`;
  updateConfigHelper();
}

function updateConfigHelper(){
  const format = document.getElementById('t_format')?.value;
  const el = document.getElementById('configHelper');
  if(!el) return;
  if(format !== 'group_knockout'){ el.innerHTML = ''; return; }

  const numGroups = parseInt(document.getElementById('t_groups').value)||1;
  const qualify = parseInt(document.getElementById('t_qualify').value)||1;
  const checked = document.querySelectorAll('#createPlayerList input[type="checkbox"]:checked');
  const playerCount = checked.length;

  if(playerCount === 0){
    el.innerHTML = `<strong>⚠️ Select participants</strong> to see the group distribution preview.`;
    return;
  }

  const distribution = distributePlayersToGroups(playerCount, numGroups);
  const totalQualifiers = numGroups * qualify;
  const bracketSize = nextPow2(totalQualifiers);

  // Seeding preview
  let seedingPreview = '';
  if(qualify >= 2){
    const pairs = [];
    for(let i=1; i<=Math.floor(qualify/2); i++){
      pairs.push(`${i}v${qualify-i+1}`);
    }
    if(qualify % 2 === 1){
      pairs.push(`${Math.ceil(qualify/2)} gets bye`);
    }
    seedingPreview = `<br>• First knockout round per group: <strong>${pairs.join(', ')}</strong>`;
  }

  el.innerHTML = `
    <strong>📊 Configuration Preview:</strong><br>
    • Participants: <strong>${playerCount} players</strong><br>
    • Group distribution: <strong>${distribution.join(', ')}</strong> players per group${distribution.some(x=>x!==distribution[0])?' (uneven — flexible)':''}<br>
    • Total qualifiers: <strong>${totalQualifiers}</strong> (${numGroups} groups × top ${qualify})<br>
    • Knockout bracket size: <strong>${bracketSize} teams</strong> ${bracketSize>totalQualifiers?`(${bracketSize-totalQualifiers} byes)` : ''}
    ${seedingPreview}
  `;
}

function toggleFormatFields(){
  const f = document.getElementById('t_format').value;
  ['group_knockout','league','single_elimination'].forEach(x=>{
    document.getElementById('format-'+x).classList.toggle('hidden', x!==f);
  });
  updateConfigHelper();
}

function saveTournament(){
  const name = document.getElementById('t_name').value.trim();
  if(!name){ toast('Tournament name is required', true); return }
  const format = document.getElementById('t_format').value;
  const dt = document.getElementById('t_datetime').value;

  // Get selected players
  const checked = Array.from(document.querySelectorAll('#createPlayerList input[type="checkbox"]:checked')).map(cb=>cb.value);
  if(checked.length === 0){
    if(!confirm('No players selected. Create tournament without participants?')) return;
  }

  const t = {
    id: uid(),
    name,
    date: dt.slice(0,10),
    startDateTime: dt,
    format,
    game: document.getElementById('t_game').value.trim(),
    prize: {
      champion: document.getElementById('t_prize_1').value.trim(),
      runnerUp: document.getElementById('t_prize_2').value.trim(),
      thirdPlace: document.getElementById('t_prize_3').value.trim()
    },
    status: document.getElementById('t_status').value,
    description: document.getElementById('t_desc').value.trim(),
    registrations: checked.map(pid=>({playerId:pid, date:new Date().toISOString()})),
    createdAt: new Date().toISOString()
  };

  if(format==='group_knockout'){
    t.groups = parseInt(document.getElementById('t_groups').value);
    t.qualifyPerGroup = parseInt(document.getElementById('t_qualify').value);
    t.knockoutFormat = document.getElementById('t_ko').value;
    t.seeding = document.getElementById('t_seeding').value;
  } else if(format==='league'){
    t.leagueRounds = parseInt(document.getElementById('t_league_rounds').value);
  }

  const tourneys = DB.get('tournaments');
  tourneys.unshift(t);
  DB.set('tournaments', tourneys);
  closeModal();
  navigate('tournament-detail', t.id);
  toast(`Tournament created with ${checked.length} participants`);
}

function startTournament(tid){
  if(!isAdmin()){ toast('Admin login required', true); return }
  const tourneys = DB.get('tournaments');
  const t = tourneys.find(x=>x.id===tid);
  if((t.registrations||[]).length < 2){

/* =========================
   RANDOM DRAW (flexible distribution)
   ========================= */
function randomDraw(tid){
  const tourneys = DB.get('tournaments');
  const t = tourneys.find(x=>x.id===tid);
  const regs = t.registrations || [];
  if(regs.length < 2){ toast('Need at least 2 players', true); return; }

  // Flexible distribution: distribute players across groups evenly
  const distribution = distributePlayersToGroups(regs.length, t.groups);
  const shuffled = [...regs].sort(()=>Math.random()-0.5);

  const groups = [];
  let idx = 0;
  for(let i=0;i<t.groups;i++){
    const size = distribution[i];
    groups.push({
      name: String.fromCharCode(65+i),
      players: shuffled.slice(idx, idx+size).map(r=>({
        playerId: r.playerId, played:0, wins:0, draws:0, losses:0, gf:0, ga:0, points:0
      }))
    });
    idx += size;
  }
  t.groupData = groups;
  t.groupsDrawn = true;
  if(t.status === 'open' || t.status === 'draft') t.status = 'active';
  DB.set('tournaments', tourneys);
  renderTournamentDetail(tid);
  toast(`Groups drawn: ${distribution.join(', ')} players per group`);
}

function startLeague(tid){
  const tourneys = DB.get('tournaments');
  const t = tourneys.find(x=>x.id===tid);
  const regs = t.registrations || [];
  if(regs.length<2){ toast('Need at least 2 players', true); return }
  t.groupData = [{
    name: 'League',
    players: regs.map(r=>({playerId:r.playerId, played:0, wins:0, draws:0, losses:0, gf:0, ga:0, points:0}))
  }];
  t.groupsDrawn = true;
  if(t.status === 'open' || t.status === 'draft') t.status = 'active';
  DB.set('tournaments', tourneys);
  renderTournamentDetail(tid);
  toast('League started');
}

/* =========================
   DYNAMIC KNOCKOUT SEEDING
   Seeding adapts to qualifyPerGroup:
   - For each group, take top N players by points
   - Within group: pair 1vN, 2v(N-1), etc.
   - If N is odd, middle seed gets bye
   ========================= */
function drawKnockout(tid){
  const tourneys = DB.get('tournaments');
  const t = tourneys.find(x=>x.id===tid);
  const N = t.qualifyPerGroup;

  // Collect qualifiers per group
  const groupQualifiers = [];
  t.groupData.forEach(g=>{
    const sorted = [...g.players].sort((a,b)=> b.points-a.points || (b.gf-b.ga)-(a.gf-a.ga) || b.gf-a.gf);
    const qualifiers = sorted.slice(0, N).map((q,i)=>({
      playerId: q.playerId,
      group: g.name,
      seed: i+1,
      points: q.points,
      gd: q.gf-q.ga
    }));
    groupQualifiers.push(qualifiers);
  });

  // Build first round: within-group pairings (1vN, 2v(N-1), etc.)
  const round1 = [];
  groupQualifiers.forEach(gq=>{
    const numPairs = Math.floor(N/2);
    for(let i=0;i<numPairs;i++){
      const top = gq[i];
      const bottom = gq[N-1-i];
      round1.push({
        id: uid(),
        team1: top.playerId,
        team2: bottom.playerId,
        score1: null, score2: null,
        leg2Score1: null, leg2Score2: null,
        winner: null,
        round: 'R1',
        label: `Group ${gq[0].group}: ${top.seed}v${bottom.seed}`
      });
    }
    // If odd N, middle seed gets bye
    if(N % 2 === 1){
      const middle = gq[Math.floor(N/2)];
      round1.push({
        id: uid(),
        team1: middle.playerId,
        team2: null,
        score1: null, score2: null,
        winner: middle.playerId,
        round: 'R1',
        label: `Group ${gq[0].group}: ${middle.seed} (bye)`,
        isBye: true
      });
    }
  });

  // Build full bracket
  const totalAfterR1 = round1.filter(m=>!m.isBye).length + round1.filter(m=>m.isBye).length;
  t.knockoutBracket = buildFullBracketFromR1(round1);

  t.knockoutDrawn = true;
  DB.set('tournaments', tourneys);
  renderTournamentDetail(tid);
  toast(`Knockout drawn · ${N} qualify per group · 1v${N}, 2v${N-1}... seeding`);
}

function buildFullBracketFromR1(round1){
  // Advance byes automatically
  const afterR1 = [];
  const byeWinners = [];
  round1.forEach(m=>{
    if(m.isBye && m.winner){
      byeWinners.push(m.winner);
    } else {
      afterR1.push(m);
    }
  });

  // Combine non-bye matches + byes as "virtual" R2 slots
  const rounds = [round1];

  // Build R2+ from non-bye matches + byes
  let currentMatches = afterR1;
  let currentByes = byeWinners;

  while(currentMatches.length > 0 || currentByes.length > 1){
    const nextRound = [];
    const winners = [...currentByes];

    // Pair up current matches
    for(let i=0;i<currentMatches.length;i+=2){
      const m1 = currentMatches[i];
      const m2 = currentMatches[i+1];
      nextRound.push({
        id: uid(),
        team1: m1?.winner || null,
        team2: m2?.winner || null,
        score1: null, score2: null,
        leg2Score1: null, leg2Score2: null,
        winner: null,
        round: 'next',
        label: 'Winner advances'
      });
    }

    // If odd matches, last one paired with a bye
    if(currentMatches.length % 2 === 1 && currentByes.length > 0){
      const lastMatch = currentMatches[currentMatches.length-1];
      const bye = currentByes.shift();
      // Replace the last "TBD vs TBD" with actual teams
      if(nextRound.length > 0){
        const last = nextRound[nextRound.length-1];
        if(!last.team1) last.team1 = lastMatch?.winner || null;
        if(!last.team2) last.team2 = bye;
      }
    } else {
      // Add remaining byes as direct advances
      currentByes.forEach(bye=>{
        nextRound.push({
          id: uid(),
          team1: bye,
          team2: null,
          score1: null, score2: null,
          winner: bye,
          round: 'next',
          label: 'Bye advance',
          isBye: true
        });
      });
      currentByes = [];
    }

    if(nextRound.length === 0) break;
    rounds.push(nextRound);
    currentMatches = nextRound.filter(m=>!m.isBye);
    currentByes = nextRound.filter(m=>m.isBye).map(m=>m.winner);
  }

  // Label rounds
  const totalTeams = round1.length;
  const labels = [];
  let size = totalTeams;
  while(size >= 2){
    if(size === 2) labels.push('Final');
    else if(size === 4) labels.push('Semi-Finals');
    else if(size === 8) labels.push('Quarter-Finals');
    else if(size === 16) labels.push('Round of 16');
    else labels.push('Round of ' + size);
    size = size / 2;
  }
  labels.reverse();
  rounds.forEach((r,i)=>{
    const lbl = labels[i] || ('Round '+(i+1));
    r.forEach(m=>{ if(m.round === 'next' || m.round === 'R1') m.round = lbl; });
  });
  // First round keeps its labels
  rounds[0].forEach(m=>{ /* keep original label */ });

  return rounds;
}

/* =========================
   SINGLE ELIMINATION
   ========================= */
function drawSingleElim(tid){
  const tourneys = DB.get('tournaments');
  const t = tourneys.find(x=>x.id===tid);
  const regs = t.registrations || [];
  if(regs.length<2){ toast('Need at least 2 players', true); return }

  let bracketSize = nextPow2(regs.length);
  const shuffled = [...regs].sort(()=>Math.random()-0.5);
  while(shuffled.length < bracketSize) shuffled.push(null);

  const round1 = [];
  for(let i=0;i<bracketSize;i+=2){
    const t1 = shuffled[i];
    const t2 = shuffled[i+1];
    round1.push({
      id: uid(),
      team1: t1?.playerId || null,
      team2: t2?.playerId || null,
      score1: null, score2: null,
      winner: null,
      round: 'R1',
      label: t1 && t2 ? 'Match' : (t1?'BYE':'TBD')
    });
  }

  t.knockoutBracket = buildFullBracketFromR1(round1);
  t.knockoutDrawn = true;
  t.knockoutFormat = 'single';
  if(t.status === 'open' || t.status === 'draft') t.status = 'active';
  DB.set('tournaments', tourneys);
  renderTournamentDetail(tid);
  toast('Bracket drawn');
}

function getPlayerFixtures(t, playerId){
  const fixtures = [];
  if(t.knockoutBracket){
    t.knockoutBracket.forEach((round,ri)=>{
      round.forEach(m=>{
        if(m.isBye) return;
        if(m.team1===playerId || m.team2===playerId){
          fixtures.push({
            stage: m.round || `Round ${ri+1}`,
            team1: m.team1, team2: m.team2,
            score1: m.score1, score2: m.score2,
            winner: m.winner,
            stageType: 'knockout'
          });
        }
      });
    });
  }
  return fixtures;
}

function getPlayerTournamentStats(t, playerId){
  let matches=0, wins=0, gf=0, ga=0;
  if(t.groupData){
    t.groupData.forEach(g=>{
      const row = g.players.find(r=>r.playerId===playerId);
      if(row){ matches+=row.played; wins+=row.wins; gf+=row.gf; ga+=row.ga; }
    });
  }
  if(t.knockoutBracket){
    t.knockoutBracket.forEach(round=>{
      round.forEach(m=>{
        if(m.isBye) return;
        if(m.team1===playerId || m.team2===playerId){
          if(m.score1!==null && m.score1!==undefined){
            matches++;
            if(m.winner===playerId) wins++;
            if(m.team1===playerId){ gf+=m.score1; ga+=m.score2; }
            else { gf+=m.score2; ga+=m.score1; }
          }
        }
      });
    });
  }
  return {matches, wins, gf, ga};
}

function switchTab(el, tabId){
  el.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('#main > div[id^="tab-"]').forEach(d=>d.classList.add('hidden'));
  const target = document.getElementById(tabId);
  if(target) target.classList.remove('hidden');
}

function saveKnockoutMatch(tid, roundIdx, matchId){
  const tourneys = DB.get('tournaments');
  const t = tourneys.find(x=>x.id===tid);
  const m = t.knockoutBracket[roundIdx].find(x=>x.id===matchId);
  const s1 = document.getElementById('km_s1').value;
  const s2 = document.getElementById('km_s2').value;
  m.score1 = s1===''?null:+s1;
  m.score2 = s2===''?null:+s2;
  const l2s1 = document.getElementById('km_l2s1');
  const l2s2 = document.getElementById('km_l2s2');
  if(l2s1){ m.leg2Score1 = l2s1.value===''?null:+l2s1.value }
  if(l2s2){ m.leg2Score2 = l2s2.value===''?null:+l2s2.value }

  const manual = document.getElementById('km_winner').value;
  if(manual){
    m.winner = manual;
  } else {
    if(m.score1!==null && m.score2!==null){
      if(t.knockoutFormat==='2leg' && m.leg2Score1!==null && m.leg2Score2!==null){
        const agg1 = m.score1 + m.leg2Score1;
        const agg2 = m.score2 + m.leg2Score2;
        m.winner = agg1>agg2 ? m.team1 : (agg2>agg1 ? m.team2 : null);
      } else {
        m.winner = m.score1>m.score2 ? m.team1 : (m.score2>m.score1 ? m.team2 : null);
      }
    }
  }

  // Advance winner
  if(m.winner && t.knockoutBracket[roundIdx+1]){
    const nextRound = t.knockoutBracket[roundIdx+1];
    const matchIndex = t.knockoutBracket[roundIdx].indexOf(m);
    const nextMatchIdx = Math.floor(matchIndex/2);
    if(nextRound[nextMatchIdx]){
      const slot = matchIndex%2===0 ? 'team1' : 'team2';
      nextRound[nextMatchIdx][slot] = m.winner;
    }
  }

  DB.set('tournaments', tourneys);
  closeModal();
  renderTournamentDetail(tid);
  toast('Match updated · Leaderboard live');
}

function openCompleteTournamentModal(tid){
  if(!isAdmin()){ toast('Admin login required', true); return }
  const t = DB.get('tournaments').find(x=>x.id===tid);
  const players = DB.get('players');

    const final = t.knockoutBracket[t.knockoutBracket.length-1]?.[0];
    if(final?.winner) championCands = [final.winner];
    if(final){
      const loser = final.winner===final.team1 ? final.team2 : final.team1;
      if(loser) runnerUpCands = [loser];
    }
    if(t.knockoutBracket.length>=2){
      const semis = t.knockoutBracket[t.knockoutBracket.length-2];

          ${allPlayers.map(p=>`<option value="${p.id}" ${runnerUpCands.includes(p.id)?'selected':''}>${p.name}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">🥉 Third Place</label>

    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="completeTournament('${tid}')">Complete Tournament</button>
    </div>
  `);
}

function completeTournament(tid){
  const tourneys = DB.get('tournaments');
  const t = tourneys.find(x=>x.id===tid);
  t.champion = document.getElementById('ct_champ').value || null;
  t.runnerUp = document.getElementById('ct_runner').value || null;
  t.thirdPlace = document.getElementById('ct_third').value || null;
  t.status = 'completed';
  t.completedAt = new Date().toISOString();
  DB.set('tournaments', tourneys);
  closeModal();
  renderTournamentDetail(tid);
  toast('🏆 Tournament completed · Leaderboard updated');
}

/* =========================
   EDIT TOURNAMENT
   ========================= */
function editTournament(tid){
  if(!isAdmin()){ toast('Admin login required', true); return }
  const t = DB.get('tournaments').find(x=>x.id===tid);
  openModal(`
    <div class="modal-head">
      <div class="modal-title">Edit Tournament</div>
      <button class="btn btn-ghost btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Name</label><input class="form-input" id="e_name" value="${t.name}"></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Start Date & Time</label><input class="form-input" type="datetime-local" id="e_datetime" value="${t.startDateTime||''}"></div>
        <div class="form-group"><label class="form-label">Status</label>
          <select class="form-select" id="e_status">
            <option value="draft" ${t.status==='draft'?'selected':''}>Draft</option>
            <option value="open" ${t.status==='open'?'selected':''}>Open</option>
            <option value="active" ${t.status==='active'?'selected':''}>Active</option>
            <option value="completed" ${t.status==='completed'?'selected':''}>Completed</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label class="form-label">Game</label><input class="form-input" id="e_game" value="${t.game||''}"></div>
      ${t.format==='group_knockout'?`
        <div class="form-row">
          <div class="form-group"><label class="form-label">Number of Groups</label><input class="form-input" type="number" id="e_groups" value="${t.groups}" min="1"></div>
          <div class="form-group"><label class="form-label">Qualify per Group</label><input class="form-input" type="number" id="e_qualify" value="${t.qualifyPerGroup}" min="1"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Knockout Format</label>
            <select class="form-select" id="e_ko">
              <option value="bo3" ${t.knockoutFormat==='bo3'?'selected':''}>Best of 3</option>
              <option value="2leg" ${t.knockoutFormat==='2leg'?'selected':''}>2-Leg</option>
              <option value="single" ${t.knockoutFormat==='single'?'selected':''}>Single Match</option>
            </select>
          </div>
          <div class="form-group"><label class="form-label">Seeding</label>
            <select class="form-select" id="e_seed">
              <option value="dynamic" ${t.seeding==='dynamic'?'selected':''}>Dynamic (1vN, 2v(N-1)...)</option>
              <option value="random" ${t.seeding==='random'?'selected':''}>Random</option>
            </select>
          </div>
        </div>
      `:''}
      <div class="card" style="background:var(--bg-2)">
        <div class="card-title" style="margin-bottom:12px">💰 Prize Pool</div>
        <div class="form-row-3">
          <div class="form-group"><label class="form-label">🥇 Champion</label><input class="form-input" id="e_p1" value="${t.prize?.champion||''}"></div>
          <div class="form-group"><label class="form-label">🥈 Runner-up</label><input class="form-input" id="e_p2" value="${t.prize?.runnerUp||''}"></div>
          <div class="form-group"><label class="form-label">🥉 Third Place</label><input class="form-input" id="e_p3" value="${t.prize?.thirdPlace||''}"></div>
        </div>
      </div>
      <div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" id="e_desc">${t.description||''}</textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTournamentEdit('${tid}')">Save Changes</button>
    </div>
  `, 'lg');
}

function saveTournamentEdit(tid){
  const tourneys = DB.get('tournaments');
  const t = tourneys.find(x=>x.id===tid);
  t.name = document.getElementById('e_name').value.trim();
  const dt = document.getElementById('e_datetime').value;
  t.startDateTime = dt;
  t.date = dt ? dt.slice(0,10) : t.date;
  t.status = document.getElementById('e_status').value;
  t.game = document.getElementById('e_game').value.trim();
  t.description = document.getElementById('e_desc').value.trim();
  t.prize = {
    champion: document.getElementById('e_p1').value.trim(),
    runnerUp: document.getElementById('e_p2').value.trim(),
    thirdPlace: document.getElementById('e_p3').value.trim()
  };
  if(t.format==='group_knockout'){
    t.groups = +document.getElementById('e_groups').value;
    t.qualifyPerGroup = +document.getElementById('e_qualify').value;
    t.knockoutFormat = document.getElementById('e_ko').value;
    t.seeding = document.getElementById('e_seed').value;
  }
  DB.set('tournaments', tourneys);
  closeModal();
  renderTournamentDetail(tid);
  toast('Tournament updated');
}

/* =========================
   LEADERBOARD
   ========================= */
function renderLeaderboard(){
  const players = DB.get('players');
  const stats = calculateAllStats();
  const tourneys = DB.get('tournaments');

  const enriched = players.map(p=>({
    p,
    s: stats[p.id] || {matches:0,wins:0,winPct:'0.0',tourneyWins:0,tourneyRunnerUp:0,tourneyThird:0,achievements:[]}
  })).sort((a,b)=> (b.s.tourneyWins-a.s.tourneyWins) || (b.s.wins-a.s.wins) || (parseFloat(b.s.winPct)-parseFloat(a.s.winPct)));

  const totalMatches = enriched.reduce((s,x)=>s+x.s.matches,0);
  const totalWins = enriched.reduce((s,x)=>s+x.s.wins,0);

  document.getElementById('main').innerHTML = `
    <div class="topbar">
      <div>
        <div class="page-title">Live Leaderboard</div>
        <div class="page-sub">Real-time rankings · Updates instantly when match results are entered</div>
      </div>
      <div class="top-actions">
        <span class="admin-indicator" style="background:rgba(16,185,129,0.12);color:var(--success);border-color:rgba(16,185,129,0.3)">
          <span style="background:var(--success);box-shadow:0 0 8px var(--success)"></span> Live
        </span>
        <button class="export-btn" onclick="exportAsJPEG('leaderboardExport','milandhoo_leaderboard')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export JPEG
        </button>
      </div>
    </div>

    <div class="grid grid-4">
      <div class="stat"><div class="stat-label">Players</div><div class="stat-value">${players.length}</div></div>
      <div class="stat"><div class="stat-label">Total Matches</div><div class="stat-value">${totalMatches}</div></div>
      <div class="stat"><div class="stat-label">Total Wins</div><div class="stat-value">${totalWins}</div></div>
      <div class="stat"><div class="stat-label">Tournaments</div><div class="stat-value">${tourneys.filter(t=>t.status==='completed').length}</div><div class="stat-delta">Completed</div></div>
    </div>

    <div id="leaderboardExport" style="background:var(--bg);padding:20px;border-radius:12px;margin-top:20px">
      <div style="text-align:center;margin-bottom:20px">
        <div style="font-family:'Rajdhani';font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px">🏆 Milandhoo eFootball · Community Leaderboard</div>
        <div style="font-size:12px;color:var(--muted);margin-top:6px">Live rankings · ${fmtDate(new Date())}</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Rank</th><th>Player</th><th>Matches</th><th>Wins</th><th>Win%</th><th>Titles</th><th>Runner-up</th><th>3rd</th></tr>
          </thead>
          <tbody>
            ${enriched.length===0 ? `<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--muted)">No players yet</td></tr>` :
              enriched.map((x,i)=>`
                <tr>
                  <td><div class="rank-badge ${i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-other'}">${i+1}</div></td>
                  <td>
                    <div class="flex gap-12" style="align-items:center">
                      ${renderAvatar(x.p, 38)}
                      <div>
                        <div style="font-weight:600">${x.p.name}</div>
                        ${x.s.achievements.length>0?`<div class="text-xs text-muted" style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${x.s.achievements.slice(-1)[0]}</div>`:''}
                      </div>
                    </div>
                  </td>
                  <td>${x.s.matches}</td>
                  <td><strong>${x.s.wins}</strong></td>
                  <td><span style="color:var(--accent);font-weight:700">${x.s.winPct}%</span></td>
                  <td>${x.s.tourneyWins>0 ? `<span class="badge badge-open">🏆 ${x.s.tourneyWins}</span>` : '<span class="text-muted">0</span>'}</td>
                  <td>${x.s.tourneyRunnerUp>0 ? `<span class="text-cyan">${x.s.tourneyRunnerUp}</span>` : '<span class="text-muted">0</span>'}</td>
                  <td>${x.s.tourneyThird>0 ? `<span style="color:#cd7f32">${x.s.tourneyThird}</span>` : '<span class="text-muted">0</span>'}</td>
                </tr>
              `).join('')
            }
          </tbody>
        </table>
      </div>
    </div>
  `;
}

/* =========================
   ADMIN PORTAL
   ========================= */
function renderAdmin(){
  const session = DB.get('session');
  if(!session){
    document.getElementById('main').innerHTML = `
      <div class="login-wrap">
        <div class="login-card">
          <div class="login-brand">
            <div class="brand-logo">
              <svg class="logo-svg" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                <path d="M30 4 L52 14 L52 34 Q52 48 30 56 Q8 48 8 34 L8 14 Z" fill="#fff" opacity="0.15"/>
                <path d="M30 4 L52 14 L52 34 Q52 48 30 56 Q8 48 8 34 L8 14 Z" fill="none" stroke="#fff" stroke-width="2" opacity="0.9"/>
                <path d="M17 42 L17 20 L24 32 L30 22 L36 32 L43 20 L43 42" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <h1>Admin Portal</h1>
            <p>Sign in to manage the community database</p>
          </div>
          <div class="form-group">
            <label class="form-label">Username</label>
            <input class="form-input" id="admin_user" placeholder="Username">
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input class="form-input" type="password" id="admin_pass" placeholder="Password" onkeydown="if(event.key==='Enter')adminLogin()">
          </div>
          <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="adminLogin()">Sign In</button>
          <div class="text-xs text-muted" style="text-align:center;margin-top:16px">Default: admin / milandhoo2026</div>
        </div>
      </div>
    `;
    return;
  }

  const players = DB.get('players');
  const tourneys = DB.get('tournaments');
  const admin = DB.get('admin');

  document.getElementById('main').innerHTML = `
    <div class="topbar">
      <div>
        <div class="page-title">Admin Portal</div>
        <div class="page-sub">Signed in as <strong>${session.username}</strong> · Full control over the community</div>
      </div>
      <div class="top-actions">
        <span class="admin-indicator">Admin Mode</span>
        <button class="btn btn-secondary" onclick="exportData()">📥 Export</button>
        <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📤 Import</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
        <button class="btn btn-danger" onclick="adminLogout()">Sign Out</button>
      </div>
    </div>

    <div class="grid grid-3">
      <div class="card" onclick="navigate('players')" style="cursor:pointer">
        <div class="card-title">👥 Manage Players</div>
        <div class="stat-value mt-16">${players.length}</div>
        <div class="text-sm text-muted">Add, edit, delete player profiles with photos</div>
      </div>
      <div class="card" onclick="navigate('tournaments')" style="cursor:pointer">
        <div class="card-title">🏆 Manage Tournaments</div>
        <div class="stat-value mt-16">${tourneys.length}</div>
        <div class="text-sm text-muted">Create, edit, run tournaments</div>
      </div>
      <div class="card" onclick="openChangePassword()" style="cursor:pointer">
        <div class="card-title">🔐 Security</div>
        <div class="text-sm text-muted mt-16">Change admin password</div>
        <div class="text-xs text-muted" style="margin-top:8px">Current: ${admin.username}</div>
      </div>
    </div>

    <div class="card mt-24">
      <div class="card-head"><div class="card-title">⚡ Quick Actions</div></div>
      <div class="flex gap-8" style="flex-wrap:wrap">
        <button class="btn btn-primary" onclick="openCreateTournament()">+ New Tournament</button>
        <button class="btn btn-secondary" onclick="openPlayerModal()">+ New Player</button>
        <button class="btn btn-secondary" onclick="navigate('leaderboard')">View Leaderboard</button>
      </div>
    </div>
  `;
}

function adminLogin(){
  const u = document.getElementById('admin_user').value.trim();
  const p = document.getElementById('admin_pass').value;
  const admin = DB.get('admin');
  if(u===admin.username && p===admin.password){
    DB.set('session', {username:u, at:new Date().toISOString()});
    toast('Welcome back, admin');
    renderAdmin();
  } else {
    toast('Invalid credentials', true);
  }
}

function adminLogout(){
  DB.set('session', null);
  toast('Signed out');
  renderAdmin();
}

function openChangePassword(){
  openModal(`
    <div class="modal-head">
      <div class="modal-title">Change Admin Password</div>
      <button class="btn btn-ghost btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Current Password</label><input class="form-input" type="password" id="cp_old"></div>
      <div class="form-group"><label class="form-label">New Password</label><input class="form-input" type="password" id="cp_new"></div>
      <div class="form-group"><label class="form-label">Confirm New Password</label><input class="form-input" type="password" id="cp_conf"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="changePassword()">Update Password</button>
    </div>
  `);
}

function changePassword(){
  const admin = DB.get('admin');
  const old = document.getElementById('cp_old').value;
  const np = document.getElementById('cp_new').value;
  const conf = document.getElementById('cp_conf').value;
  if(old!==admin.password){ toast('Current password is wrong', true); return }
  if(np.length<4){ toast('Password too short', true); return }
  if(np!==conf){ toast('Passwords do not match', true); return }
  admin.password = np;
  DB.set('admin', admin);
  closeModal();
  toast('Password updated');
}

function exportData(){
  const data = {
    players: DB.get('players'),
    tournaments: DB.get('tournaments'),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `milandhoo-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Data exported');
}

function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(data.players) DB.set('players', data.players);
      if(data.tournaments) DB.set('tournaments', data.tournaments);
      toast('Data imported successfully');
      navigate(currentView);
    } catch { toast('Invalid file', true) }
  };
  reader.readAsText(file);
}

/* Init */
navigate('dashboard');
</script>
</body>
</html>
