<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Milandhoo eFootball Community</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --primary:#0066ff;
    --primary-dark:#0052cc;
    --primary-light:#3385ff;
    --primary-glow:rgba(0,102,255,0.15);
    --secondary:#00d4ff;
    --accent:#ff6b35;
    --success:#00c853;
    --success-light:rgba(0,200,83,0.1);
    --warning:#ffb300;
    --warning-light:rgba(255,179,0,0.1);
    --danger:#ff1744;
    --danger-light:rgba(255,23,68,0.1);
    --bg:#f0f4f8;
    --bg-2:#e8eef5;
    --surface:#ffffff;
    --surface-2:#f5f8fc;
    --surface-3:#eef3f9;
    --border:#e1e8f0;
    --border-2:#d0d9e4;
    --dark:#0a0e27;
    --text:#1a2342;
    --text-2:#5a6a8a;
    --text-muted:#8a9bb8;
    --shadow:0 2px 12px rgba(10,14,39,0.06);
    --shadow-md:0 4px 20px rgba(10,14,39,0.08);
    --shadow-lg:0 8px 30px rgba(10,14,39,0.12);
    --radius:14px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow-x:hidden}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;color:inherit}

  .logo-svg{width:100%;height:100%;display:block}

  .app{display:flex;min-height:100vh;position:relative}
  .sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;z-index:50;display:flex;flex-direction:column;padding:20px 0;transition:transform .3s ease}
  .brand{padding:0 24px 20px;border-bottom:1px solid var(--border);margin-bottom:16px}
  .brand-logo{display:flex;align-items:center;gap:12px}
  .brand-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;box-shadow:0 4px 14px var(--primary-glow);flex-shrink:0}
  .brand-name{font-family:'Rajdhani';font-size:22px;font-weight:700;color:var(--dark);letter-spacing:-0.5px;line-height:1}
  .brand-sub{font-size:10px;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;margin-top:2px;font-weight:600}
  .nav{padding:0 12px;flex:1;overflow-y:auto}
  .nav-section{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;padding:14px 12px 6px;font-weight:700}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:var(--text-2);font-weight:500;font-size:14px;transition:all .2s;margin-bottom:2px;white-space:nowrap}
  .nav-item:hover{background:var(--surface-2);color:var(--primary)}
  .nav-item.active{background:var(--primary-glow);color:var(--primary);font-weight:600}
  .nav-item svg{width:18px;height:18px;flex-shrink:0}
  .sidebar-foot{padding:20px 24px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted)}

  .main{margin-left:260px;flex:1;padding:28px 36px;max-width:100%;min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap}
  .page-title{font-family:'Rajdhani';font-size:30px;font-weight:700;color:var(--dark);letter-spacing:-0.5px;text-transform:uppercase;word-break:break-word}
  .page-sub{color:var(--text-muted);font-size:13px;margin-top:2px}
  .top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:600;font-size:13px;transition:all .2s;border:1px solid transparent;letter-spacing:0.3px;white-space:nowrap}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;box-shadow:0 4px 14px var(--primary-glow)}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--primary-glow)}
  .btn-secondary{background:var(--surface);border-color:var(--border);color:var(--text)}
  .btn-secondary:hover{background:var(--surface-2);border-color:var(--primary);color:var(--primary)}
  .btn-ghost{color:var(--text-muted);padding:8px 12px}
  .btn-ghost:hover{color:var(--primary);background:var(--primary-glow)}
  .btn-danger{background:var(--danger-light);color:var(--danger);border-color:rgba(255,23,68,0.2)}
  .btn-danger:hover{background:rgba(255,23,68,0.15)}
  .btn-success{background:linear-gradient(135deg,var(--success),#00a844);color:#fff;box-shadow:0 4px 14px rgba(0,200,83,0.3)}
  .btn-sm{padding:6px 12px;font-size:12px}
  .btn-icon{padding:8px;width:36px;height:36px;justify-content:center;flex-shrink:0}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;transition:all .2s;box-shadow:var(--shadow);overflow:hidden}
  .card:hover{border-color:var(--border-2);box-shadow:var(--shadow-md)}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
  .card-title{font-family:'Rajdhani';font-size:17px;font-weight:700;color:var(--dark);text-transform:uppercase;letter-spacing:0.5px;word-break:break-word}

  .grid{display:grid;gap:16px}
  .grid-2{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .grid-4{grid-template-columns:repeat(4,1fr)}

  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
  .stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--secondary))}
  .stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
  .stat-value{font-family:'Rajdhani';font-size:34px;font-weight:700;margin-top:6px;letter-spacing:0.5px;line-height:1;color:var(--dark);word-break:break-word}
  .stat-delta{font-size:12px;color:var(--primary);margin-top:4px;font-weight:500}

  .table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:600px}
  th{text-align:left;padding:13px 16px;background:var(--surface-2);color:var(--text-muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border);white-space:nowrap}
  td{padding:13px 16px;border-bottom:1px solid var(--border);word-break:break-word}
  tr:last-child td{border-bottom:none}
  tbody tr{transition:background .15s}
  tbody tr:hover{background:var(--surface-2)}

  .form-group{margin-bottom:15px}
  .form-label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
  .form-input,.form-select,.form-textarea{width:100%;padding:11px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;transition:all .2s}
  .form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow);background:var(--surface)}
  .form-textarea{resize:vertical;min-height:80px}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

  .badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;white-space:nowrap}
  .badge-open{background:var(--success-light);color:var(--success);border:1px solid rgba(0,200,83,0.25)}
  .badge-active{background:rgba(0,102,255,0.1);color:var(--primary);border:1px solid rgba(0,102,255,0.25)}
  .badge-completed{background:rgba(138,155,184,0.15);color:var(--text-muted);border:1px solid rgba(138,155,184,0.3)}
  .badge-draft{background:var(--warning-light);color:var(--warning);border:1px solid rgba(255,179,0,0.3)}
  .badge-format{background:var(--primary-glow);color:var(--primary);border:1px solid rgba(0,102,255,0.25)}

  .modal-overlay{position:fixed;inset:0;background:rgba(10,14,39,0.5);backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-overlay.show{display:flex;animation:fadeIn .2s}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideUp .3s}
  .modal-lg{max-width:880px}
  .modal-xl{max-width:1000px}
  .modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:1}
  .modal-title{font-family:'Rajdhani';font-size:20px;font-weight:700;color:var(--dark);text-transform:uppercase;letter-spacing:0.5px}
  .modal-body{padding:22px 24px}
  .modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--surface)}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

  .player-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden;transition:all .25s;box-shadow:var(--shadow)}
  .player-card:hover{transform:translateY(-3px);border-color:var(--primary);box-shadow:var(--shadow-md)}
  .player-avatar{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;margin-bottom:12px;font-family:'Rajdhani';box-shadow:0 4px 14px var(--primary-glow);overflow:hidden;flex-shrink:0}
  .player-avatar img{width:100%;height:100%;object-fit:cover}
  .player-name{font-family:'Rajdhani';font-size:18px;font-weight:700;margin-bottom:4px;color:var(--dark);text-transform:uppercase;letter-spacing:0.5px;word-break:break-word}
  .player-meta{font-size:12px;color:var(--text-muted);margin-bottom:12px;word-break:break-word}
  .player-stats{display:flex;gap:16px;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap}
  .player-stat-val{font-family:'Rajdhani';font-size:20px;font-weight:700;line-height:1;color:var(--dark)}
  .player-stat-lbl{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;margin-top:2px}

  .tourney-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;box-shadow:var(--shadow)}
  .tourney-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .tourney-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--secondary));transform:scaleX(0);transform-origin:left;transition:transform .3s}
  .tourney-card:hover::after{transform:scaleX(1)}
  .tourney-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px}
  .tourney-name{font-family:'Rajdhani';font-size:19px;font-weight:700;color:var(--dark);text-transform:uppercase;letter-spacing:0.5px;line-height:1.2;word-break:break-word;flex:1}
  .tourney-date{font-size:12px;color:var(--text-muted);margin-top:4px;word-break:break-word}
  .tourney-stats{display:flex;gap:18px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);flex-wrap:wrap}
  .tourney-stat{flex:1;min-width:80px}
  .tourney-stat-val{font-family:'Rajdhani';font-size:20px;font-weight:700;line-height:1;color:var(--dark);word-break:break-word}
  .tourney-stat-lbl{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.6px;margin-top:2px}

  .tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:22px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab{padding:12px 18px;font-weight:600;font-size:13px;color:var(--text-muted);border-bottom:2px solid transparent;cursor:pointer;transition:all .2s;white-space:nowrap;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:-2px;flex-shrink:0}
  .tab:hover{color:var(--primary)}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary)}

  .group-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .group-title{font-family:'Rajdhani';font-weight:700;font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:10px;color:var(--dark);text-transform:uppercase;letter-spacing:1px;flex-wrap:wrap}
  .group-title::before{content:'';width:4px;height:20px;background:linear-gradient(180deg,var(--primary),var(--secondary));border-radius:2px;flex-shrink:0}
  .group-table{width:100%;font-size:13px}
  .group-table th{padding:8px 10px;font-size:10px}
  .group-table td{padding:10px}
  .qualify{background:var(--success-light)}
  .qualify td:first-child{position:relative}
  .qualify td:first-child::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--success)}

  .bracket{display:flex;gap:36px;overflow-x:auto;padding:20px 0;-webkit-overflow-scrolling:touch}
  .bracket-round{display:flex;flex-direction:column;justify-content:space-around;min-width:220px;gap:18px;flex-shrink:0}
  .bracket-match{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:13px;box-shadow:var(--shadow)}
  .bracket-match-title{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:700;word-break:break-word}
  .bracket-team{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border);gap:8px}
  .bracket-team:last-child{border-bottom:none}
  .bracket-team.winner{color:var(--primary);font-weight:700}
  .bracket-team.tbd{color:var(--text-muted);font-style:italic}
  .bracket-team span:first-child{flex:1;word-break:break-word;min-width:0}
  .bracket-team span:last-child{flex-shrink:0}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--dark);color:#fff;padding:14px 20px;border-radius:10px;font-size:14px;z-index:200;font-weight:500;box-shadow:var(--shadow-lg);animation:slideIn .3s;border-left:4px solid var(--primary);max-width:calc(100% - 48px);word-break:break-word}
  .toast.error{border-left-color:var(--danger)}
  @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

  .empty{text-align:center;padding:60px 20px;color:var(--text-muted)}
  .empty-title{font-family:'Rajdhani';font-size:20px;color:var(--dark);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}

  .login-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px;width:100%;max-width:420px;box-shadow:var(--shadow-lg)}
  .login-brand{text-align:center;margin-bottom:28px}
  .login-brand .brand-icon{width:70px;height:70px;margin:0 auto 18px;border-radius:18px;font-size:32px}
  .login-brand h1{font-family:'Rajdhani';font-size:26px;margin-bottom:4px;color:var(--dark);text-transform:uppercase;letter-spacing:1px}
  .login-brand p{color:var(--text-muted);font-size:13px}

  .mobile-toggle{display:none;position:fixed;top:16px;left:16px;z-index:60;background:var(--surface);border:1px solid var(--border);padding:10px;border-radius:8px;box-shadow:var(--shadow)}
  .mobile-overlay{display:none;position:fixed;inset:0;background:rgba(10,14,39,0.5);z-index:40}
  .mobile-overlay.show{display:block}

  @media(max-width:900px){
    .sidebar{transform:translateX(-100%)}
    .sidebar.open{transform:translateX(0)}
    .main{margin-left:0;padding:20px;padding-top:70px}
    .mobile-toggle{display:block}
    .grid-4{grid-template-columns:repeat(2,1fr)}
    .grid-3{grid-template-columns:repeat(2,1fr)}
    .form-row,.form-row-3{grid-template-columns:1fr}
    .page-title{font-size:24px}
    .top-actions{width:100%;justify-content:flex-start}
    .top-actions .btn{flex:1;justify-content:center}
    .tourney-stats{flex-direction:column;gap:10px}
    .tourney-stat{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--surface-2);border-radius:8px}
    .tourney-stat-val{font-size:16px}
    .bracket{gap:20px}
    .bracket-round{min-width:200px}
    .player-stats{gap:12px}
    .player-stat-val{font-size:18px}
    .stat-value{font-size:28px}
    .modal{max-width:100%;margin:10px;max-height:95vh}
    .modal-head,.modal-foot{padding:16px}
    .modal-body{padding:16px}
    .hero-banner{padding:24px 20px}
    .hero-title{font-size:28px}
    .export-container{padding:16px}
    .fixture-card{flex-direction:column;align-items:stretch;gap:10px}
    .fixture-teams{width:100%}
    .fixture-stage{width:100%;text-align:center}
  }

  @media(max-width:600px){
    .grid-4,.grid-3,.grid-2{grid-template-columns:1fr}
    .page-title{font-size:22px}
    .stat{padding:16px}
    .stat-value{font-size:24px}
    .card{padding:16px}
    .card-title{font-size:15px}
    .tourney-name{font-size:16px}
    .player-name{font-size:16px}
    .tabs{gap:0}
    .tab{padding:10px 14px;font-size:12px}
    .bracket-round{min-width:180px}
    .bracket-match{padding:8px 10px;font-size:12px}
    .hero-title{font-size:24px}
    .hero-sub{font-size:13px}
    .countdown-timer{gap:8px}
    .countdown-unit{padding:8px 10px;min-width:60px}
    .countdown-num{font-size:24px}
  }

  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

  .flex{display:flex}
  .flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
  .mt-16{margin-top:16px}.mt-24{margin-top:24px}.mb-16{margin-bottom:16px}
  .text-muted{color:var(--text-muted)}
  .text-sm{font-size:13px}
  .text-xs{font-size:11px}
  .hidden{display:none !important}
  .text-primary{color:var(--primary)}
  .text-success{color:var(--success)}

  .prize-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
  .prize-card.gold{border-color:rgba(255,215,0,0.4);background:linear-gradient(135deg,rgba(255,215,0,0.08),var(--surface))}
  .prize-card.silver{border-color:rgba(192,192,192,0.4);background:linear-gradient(135deg,rgba(192,192,192,0.06),var(--surface))}
  .prize-card.bronze{border-color:rgba(205,127,50,0.3);background:linear-gradient(135deg,rgba(205,127,50,0.06),var(--surface))}
  .prize-icon{font-size:32px;margin-bottom:6px}
  .prize-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
  .prize-value{font-family:'Rajdhani';font-size:22px;font-weight:700;margin-top:4px;color:var(--dark);word-break:break-word}
  .prize-winner{font-size:12px;color:var(--primary);margin-top:4px;font-weight:600;word-break:break-word}

  .rank-badge{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-weight:700;font-size:12px;font-family:'Rajdhani';flex-shrink:0}
  .rank-1{background:linear-gradient(135deg,#ffd700,#ff9500);color:#fff;box-shadow:0 4px 12px rgba(255,215,0,0.3)}
  .rank-2{background:linear-gradient(135deg,#c0c0c0,#8a8a8a);color:#fff}
  .rank-3{background:linear-gradient(135deg,#cd7f32,#8b4513);color:#fff}
  .rank-other{background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border)}

/* =========================
   AUTO-CALCULATE STATS
   ========================= */
function calculateAllStats(){
  const players = DB.get('players');
  const tournaments = DB.get('tournaments');
  const stats = {};
  players.forEach(p=>{
    stats[p.id] = {matches:0, wins:0, draws:0, losses:0, gf:0, ga:0, tourneyWins:0, tourneyRunnerUp:0, tourneyThird:0, achievements:[]};
  });

  tournaments.forEach(t=>{
    if(t.groupData){
      t.groupData.forEach(g=>{
        g.players.forEach(row=>{
          if(stats[row.playerId]){
            stats[row.playerId].matches += row.played;
            stats[row.playerId].wins += row.wins;
            stats[row.playerId].draws += row.draws||0;
            stats[row.playerId].losses += row.losses;
            stats[row.playerId].gf += row.gf;
            stats[row.playerId].ga += row.ga;
          }
        });
      });
    }
    if(t.knockoutBracket){
      t.knockoutBracket.forEach(round=>{
        round.forEach(m=>{
          if(m.score1!==null && m.score1!==undefined && m.score2!==null && m.score2!==undefined){
            if(stats[m.team1]) stats[m.team1].matches += 1;
            if(stats[m.team2]) stats[m.team2].matches += 1;
            if(m.winner===m.team1 && stats[m.team1]) stats[m.team1].wins += 1;
            else if(m.winner===m.team2 && stats[m.team2]) stats[m.team2].wins += 1;
          }
        });
      });
    }
    if(t.status==='completed'){
      if(t.champion && stats[t.champion]){ stats[t.champion].tourneyWins += 1; stats[t.champion].achievements.push(`🏆 Champion · ${t.name}`); }
      if(t.runnerUp && stats[t.runnerUp]){ stats[t.runnerUp].tourneyRunnerUp += 1; stats[t.runnerUp].achievements.push(` Runner-up · ${t.name}`); }
      if(t.thirdPlace && stats[t.thirdPlace]){ stats[t.thirdPlace].tourneyThird += 1; stats[t.thirdPlace].achievements.push(`🥉 Third Place · ${t.name}`); }
    }
  });

  Object.values(stats).forEach(s=>{
    s.winPct = s.matches ? ((s.wins/s.matches)*100).toFixed(1) : '0.0';
  });
  return stats;
}

/* =========================

function toast(msg, err=false){

  document.body.appendChild(t);

}
function closeModal(){ document.getElementById('modal').classList.remove('show') }

/* =========================
   COUNTDOWN TIMER
   ========================= */
function startCountdown(targetDateTime, elementId){
  if(countdownInterval) clearInterval(countdownInterval);
  const target = new Date(targetDateTime).getTime();

  function update(){
    const el = document.getElementById(elementId);
    if(!el) { clearInterval(countdownInterval); return; }
    const now = Date.now();
    const diff = target - now;

    if(diff > 0){
      const days = Math.floor(diff / (1000*60*60*24));
      const hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
      const mins = Math.floor((diff % (1000*60*60)) / (1000*60));
      const secs = Math.floor((diff % (1000*60)) / 1000);
      el.innerHTML = `
        <div class="countdown-timer">
          <div class="countdown-unit"><div class="countdown-num">${days}</div><div class="countdown-txt">Days</div></div>
          <div class="countdown-unit"><div class="countdown-num">${String(hours).padStart(2,'0')}</div><div class="countdown-txt">Hours</div></div>
          <div class="countdown-unit"><div class="countdown-num">${String(mins).padStart(2,'0')}</div><div class="countdown-txt">Minutes</div></div>
          <div class="countdown-unit"><div class="countdown-num">${String(secs).padStart(2,'0')}</div><div class="countdown-txt">Seconds</div></div>
        </div>
        <div class="countdown-status upcoming">⏱ Starts in</div>
      `;
    } else {
      const elapsed = -diff;
      const hours = Math.floor(elapsed/(1000*60*60));
      const mins = Math.floor((elapsed%(1000*60*60))/(1000*60));
      el.innerHTML = `
        <div class="countdown-timer">
          <div class="countdown-unit"><div class="countdown-num" style="color:var(--danger)">🔴</div><div class="countdown-txt">Live</div></div>
          <div class="countdown-unit"><div class="countdown-num">${hours}</div><div class="countdown-txt">Hours</div></div>
          <div class="countdown-unit"><div class="countdown-num">${String(mins).padStart(2,'0')}</div><div class="countdown-txt">Minutes</div></div>
        </div>
        <div class="countdown-status live">● Tournament Live Now</div>
      `;
    }
  }
  update();
  countdownInterval = setInterval(update, 1000);
}

/* =========================

async function exportAsJPEG(elementId, filename){
  const el = document.getElementById(elementId);
  if(!el){ toast('Nothing to export', true); return }
  toast('Generating image...');
  try{
    const canvas = await html2canvas(el, {backgroundColor: '#ffffff', scale: 2, useCORS: true, logging: false});
    const link = document.createElement('a');
    link.download = `${filename}.jpeg`;
    link.href = canvas.toDataURL('image/jpeg', 0.95);
    link.click();
    toast('Image downloaded');
  } catch(e){ console.error(e); toast('Export failed', true); }
}

/* =========================
   FLEXIBLE GROUP DISTRIBUTION
   ========================= */
function distributePlayersToGroups(playerCount, numGroups){
  if(numGroups < 1) numGroups = 1;
  if(playerCount < numGroups) numGroups = playerCount;
  const baseSize = Math.floor(playerCount / numGroups);
  const remainder = playerCount % numGroups;
  const groups = [];
  for(let i=0;i<numGroups;i++){
    groups.push(i < remainder ? baseSize + 1 : baseSize);
  }
  return groups;
}

function nextPow2(n){ let p=1; while(p<n) p*=2; return p; }

/* =========================
   PHOTO UPLOAD
   ========================= */
function handlePhotoUpload(inputEl, previewEl, callback){
  const file = inputEl.files[0];
  if(!file){ return }
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      const size = 200;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const min = Math.min(img.width, img.height);
      const sx = (img.width - min) / 2;
      const sy = (img.height - min) / 2;
      ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      previewEl.innerHTML = `<img src="${dataUrl}" alt="preview">`;
      callback(dataUrl);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderAvatar(player, size=54){

  }
  return `<div class="player-avatar" style="width:${size}px;height:${size}px;font-size:${size*0.37}px">${player?player.name.charAt(0):'?'}</div>`;
}

function renderTopPlayersList(){
  const players = DB.get('players');
  const stats = calculateAllStats();
  if(players.length===0) return '<div class="empty"><div class="empty-title">No players yet</div></div>';
  const ranked = [...players].map(p=>({p, s:stats[p.id]||{}})).sort((a,b)=> (b.s.tourneyWins-a.s.tourneyWins) || (b.s.wins-a.s.wins));
  return ranked.slice(0,5).map((x,i)=>`
    <div class="flex-between" style="padding:12px 0;border-bottom:1px solid var(--border)">
      <div class="flex gap-12" style="align-items:center">
        <div class="rank-badge ${i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-other'}">${i+1}</div>
        ${renderAvatar(x.p, 36)}
        <div style="min-width:0;flex:1">
          <div style="font-weight:600;font-size:14px;color:var(--dark);word-break:break-word">${x.p.name}</div>
          <div class="text-xs text-muted">${x.s.matches||0} matches · ${x.s.winPct||0}% win</div>
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-family:'Rajdhani';font-weight:700;color:var(--primary);font-size:18px">${x.s.wins||0}W</div>
        ${x.s.tourneyWins>0?`<div class="text-xs text-primary">🏆 ${x.s.tourneyWins}</div>`:''}
      </div>
    </div>
  `).join('');
}

    return `
    <div class="player-card">
      <div class="flex-between">
        ${renderAvatar(p, 54)}

          <button class="btn btn-ghost btn-icon btn-sm" onclick="openPlayerModal('${p.id}')">

        <div><div class="player-stat-val">${s.wins}</div><div class="player-stat-lbl">Wins</div></div>
        <div><div class="player-stat-val" style="color:var(--primary)">${s.winPct}%</div><div class="player-stat-lbl">Win%</div></div>

      </div>
      <div class="form-group">
        <label class="form-label">Previous Achievements</label>
        <input class="form-input" id="p_achievements" value="${p.achievements||''}" placeholder="e.g. Champion Season 4">
      </div>
      <div class="text-sm text-muted">Stats (matches, wins, win%, achievements) are auto-calculated from tournament results.</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="savePlayer('${id||''}')">${id?'Save Changes':'Add Player'}</button>
    </div>
  `);
  window._tempPhoto = p.photo || null;
}

function savePlayer(id){
  const name = document.getElementById('p_name').value.trim();
  if(!name){ toast('Player name is required', true); return }
  const players = DB.get('players');
  const photo = window._tempPhoto;
  const achievements = document.getElementById('p_achievements').value.trim();
  if(id){
    const idx = players.findIndex(p=>p.id===id);
    players[idx] = {...players[idx], name, photo, achievements};
  } else {
    players.push({id:uid(), name, photo, achievements});
  }
  DB.set('players', players);
  window._tempPhoto = null;
  closeModal();
  renderPlayers();
  toast('Player saved');
}

function deletePlayer(id){
  if(!confirm('Delete this player? This cannot be undone.')) return;
  DB.set('players', DB.get('players').filter(p=>p.id!==id));
  renderPlayers();
  toast('Player deleted');
}

function toggleAllCreateChecks(state){
  document.querySelectorAll('#createPlayerList input[type="checkbox"]').forEach(cb=>{
    cb.checked = state;
    cb.closest('.player-check-item').classList.toggle('selected', state);
  });
  updateCreateSelection();
}

function updateCreateSelection(){
  document.querySelectorAll('#createPlayerList .player-check-item').forEach(item=>{
    const cb = item.querySelector('input[type="checkbox"]');
    item.classList.toggle('selected', cb.checked);
  });
  const checked = document.querySelectorAll('#createPlayerList input[type="checkbox"]:checked');
  const el = document.getElementById('createSelectionSummary');
  if(el) el.innerHTML = `<strong>Selected:</strong> ${checked.length} player${checked.length!==1?'s':''}`;
  updateConfigHelper();
}

function updateConfigHelper(){
  const format = document.getElementById('t_format')?.value;
  const el = document.getElementById('configHelper');
  if(!el) return;
  if(format !== 'group_knockout'){ el.innerHTML = ''; return; }

  const numGroups = parseInt(document.getElementById('t_groups').value)||1;
  const qualify = parseInt(document.getElementById('t_qualify').value)||1;
  const checked = document.querySelectorAll('#createPlayerList input[type="checkbox"]:checked');
  const playerCount = checked.length;

  if(playerCount === 0){
    el.innerHTML = `<strong>⚠️ Select participants</strong> to see the group distribution preview.`;
    return;
  }

  const distribution = distributePlayersToGroups(playerCount, numGroups);
  const totalQualifiers = numGroups * qualify;
  const bracketSize = nextPow2(totalQualifiers);

  let seedingPreview = '';
  if(qualify >= 2){
    const pairs = [];
    for(let i=1; i<=Math.floor(qualify/2); i++){
      pairs.push(`${i}v${qualify-i+1}`);
    }
    if(qualify % 2 === 1){
      pairs.push(`${Math.ceil(qualify/2)} gets bye`);
    }
    seedingPreview = `<br>• First knockout round per group: <strong>${pairs.join(', ')}</strong>`;
  }

  el.innerHTML = `
    <strong>📊 Configuration Preview:</strong><br>
    • Participants: <strong>${playerCount} players</strong><br>
    • Group distribution: <strong>${distribution.join(', ')}</strong> players per group${distribution.some(x=>x!==distribution[0])?' (uneven — flexible)':''}<br>
    • Total qualifiers: <strong>${totalQualifiers}</strong> (${numGroups} groups × top ${qualify})<br>
    • Knockout bracket size: <strong>${bracketSize} teams</strong> ${bracketSize>totalQualifiers?`(${bracketSize-totalQualifiers} byes)` : ''}
    ${seedingPreview}
  `;
}

function toggleFormatFields(){
  const f = document.getElementById('t_format').value;
  ['group_knockout','league','single_elimination'].forEach(x=>{
    document.getElementById('format-'+x).classList.toggle('hidden', x!==f);
  });
  updateConfigHelper();
}

function saveTournament(){
  const name = document.getElementById('t_name').value.trim();
  if(!name){ toast('Tournament name is required', true); return }
  const format = document.getElementById('t_format').value;
  const dt = document.getElementById('t_datetime').value;
  const deadline = document.getElementById('t_deadline').value;

  const checked = Array.from(document.querySelectorAll('#createPlayerList input[type="checkbox"]:checked')).map(cb=>cb.value);
  if(checked.length === 0){
    if(!confirm('No players selected. Create tournament without participants?')) return;
  }

  const t = {
    id: uid(),
    name,
    date: dt.slice(0,10),
    startDateTime: dt,
    groupDeadline: deadline,
    format,
    game: document.getElementById('t_game').value.trim(),
    prize: {
      champion: document.getElementById('t_prize_1').value.trim(),
      runnerUp: document.getElementById('t_prize_2').value.trim(),
      thirdPlace: document.getElementById('t_prize_3').value.trim()
    },
    status: document.getElementById('t_status').value,
    description: document.getElementById('t_desc').value.trim(),
    registrations: checked.map(pid=>({playerId:pid, date:new Date().toISOString()})),
    createdAt: new Date().toISOString()
  };

  if(format==='group_knockout'){
    t.groups = parseInt(document.getElementById('t_groups').value);
    t.qualifyPerGroup = parseInt(document.getElementById('t_qualify').value);
    t.knockoutFormat = document.getElementById('t_ko').value;
    t.seeding = document.getElementById('t_seeding').value;
  } else if(format==='league'){
    t.leagueRounds = parseInt(document.getElementById('t_league_rounds').value);

  const tourneys = DB.get('tournaments');
  tourneys.unshift(t);
  DB.set('tournaments', tourneys);
  closeModal();

}

function startTournament(tid){
  if(!isAdmin()){ toast('Admin login required', true); return }
  const tourneys = DB.get('tournaments');
  const t = tourneys.find(x=>x.id===tid);
  if((t.registrations||[]).length < 2){
    toast('Need at least 2 players to start', true);
    return;
  }
  t.status = 'active';
  t.startedAt = new Date().toISOString();
  DB.set('tournaments', tourneys);
  renderTournamentDetail(tid);
  toast('🚀 Tournament started! Scores can now be updated.');
}

    </div>
  `);
  updateSelectionSummary();
}

function toggleCheckItem(cb){
  cb.closest('.player-check-item').classList.toggle('selected', cb.checked);
  updateSelectionSummary();
}

function toggleAllChecks(state){
  document.querySelectorAll('#playerCheckList input[type="checkbox"]').forEach(cb=>{
    cb.checked = state;
    cb.closest('.player-check-item').classList.toggle('selected', state);
  });
  updateSelectionSummary();
}

function updateSelectionSummary(){
  const el = document.getElementById('selectionSummary');
  if(!el) return;
  const checked = document.querySelectorAll('#playerCheckList input[type="checkbox"]:checked');
  el.innerHTML = `<strong>Selected:</strong> ${checked.length} player${checked.length!==1?'s':''}`;
}

function saveCheckboxRegistration(tid){
  const tourneys = DB.get('tournaments');
  const t = tourneys.find(x=>x.id===tid);
  const checked = Array.from(document.querySelectorAll('#playerCheckList input[type="checkbox"]:checked')).map(cb=>cb.value);

  const existingMap = {};
  (t.registrations||[]).forEach(r=>{ existingMap[r.playerId] = r.date });
  t.registrations = checked.map(pid=>({
    playerId: pid,
    date: existingMap[pid] || new Date().toISOString()
  }));
  DB.set('tournaments', tourneys);
  closeModal();
  renderTournamentDetail(tid);
  toast(`Saved ${checked.length} player${checked.length!==1?'s':''}`);
}

function unregisterPlayer(tid, playerId){
  if(!confirm('Remove this player from the tournament?')) return;
  const tourneys = DB.get('tournaments');
  const t = tourneys.find(x=>x.id===tid);
  t.registrations = (t.registrations||[]).filter(r=>r.playerId!==playerId);
  DB.set('tournaments', tourneys);
  renderTournamentDetail(tid);
  toast('Player removed');
}

function renderStandingsTab(t, admin, canEditScores, isDeadlinePassed){
  const players = DB.get('players');

  if(t.format==='group_knockout'){
    if(!t.groupData || t.groupData.length===0) return `<div class="empty"><div class="empty-title">Groups not drawn yet</div><div class="text-sm">${admin?'Perform a random draw from the Players tab.':'Waiting for admin to draw groups.'}</div></div>`;

      return `
        <div class="group-card">

              <tbody>
                ${sorted.map((row,i)=>{
                  const p = players.find(x=>x.id===row.playerId);
                  const qualifies = i < t.qualifyPerGroup;
                  return `<tr class="${qualifies?'qualify':''}">
                    <td>${i+1}</td>
                    <td><div class="flex gap-8" style="align-items:center">${renderAvatar(p||{name:'?'}, 26)}<strong>${p?p.name:'Unknown'}</strong></div></td>

                    <td>${row.gf}</td><td>${row.ga}</td><td>${row.gf-row.ga}</td>
                    <td><strong style="color:var(--primary)">${row.points}</strong></td>

            <tbody>
              ${sorted.map((row,i)=>{
                const p = players.find(x=>x.id===row.playerId);
                return `<tr class="${i===0?'qualify':''}">
                  <td><div class="rank-badge ${i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-other'}">${i+1}</div></td>
                  <td><div class="flex gap-8" style="align-items:center">${renderAvatar(p||{name:'?'}, 26)}<strong>${p?p.name:'Unknown'}</strong></div></td>
                  <td>${row.played}</td><td>${row.wins}</td><td>${row.draws||0}</td><td>${row.losses}</td>
                  <td>${row.gf}</td><td>${row.ga}</td><td>${row.gf-row.ga}</td>
                  <td><strong style="color:var(--primary)">${row.points}</strong></td>
                  ${admin && canEditScores?`<td><button class="btn btn-ghost btn-sm" onclick="openMatchModal('${t.id}',0,'${row.playerId}')">Update</button></td>`:''}
                </tr>`;
              }).join('')}

          </table>
        </div>
      </div>
    `;
  }

  return `
    <div class="flex-between mb-16">
      <div class="card-title"> ${t.format==='league'?'League Standings':'Group Standings'}</div>
      <button class="export-btn" onclick="exportAsJPEG('standingsExport','${t.name.replace(/\s+/g,'_')}_standings')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>

      </div>

/* =========================
   RANDOM DRAW
   ========================= */
function randomDraw(tid){
  const tourneys = DB.get('tournaments');
  const t = tourneys.find(x=>x.id===tid);
  const regs = t.registrations || [];
  if(regs.length < 2){ toast('Need at least 2 players', true); return; }

  const distribution = distributePlayersToGroups(regs.length, t.groups);
  const shuffled = [...regs].sort(()=>Math.random()-0.5);

  const groups = [];
  let idx = 0;
  for(let i=0;i<t.groups;i++){
    const size = distribution[i];
    groups.push({
      name: String.fromCharCode(65+i),
      players: shuffled.slice(idx, idx+size).map(r=>({
        playerId: r.playerId, played:0, wins:0, draws:0, losses:0, gf:0, ga:0, points:0
      }))
    });
    idx += size;
  }
  t.groupData = groups;
  t.groupsDrawn = true;
  if(t.status === 'open' || t.status === 'draft') t.status = 'active';

/* =========================
   AUTO-GENERATE FIXTURES & BRACKET
   ========================= */
function generateFixturesAndBracket(tid){
  const tourneys = DB.get('tournaments');
  const t = tourneys.find(x=>x.id===tid);

  if(!t.groupData || t.groupData.length===0) return;

  // Generate group stage fixtures (round-robin within each group)
  const fixtures = [];
  t.groupData.forEach(g=>{
    for(let i=0;i<g.players.length;i++){
      for(let j=i+1;j<g.players.length;j++){
        fixtures.push({
          group: g.name,
          team1: g.players[i].playerId,
          team2: g.players[j].playerId,
          score1: null,
          score2: null,
          played: false
        });
      }
    }
  });
  t.fixtures = fixtures;

  // Generate knockout bracket
  if(t.format==='group_knockout' && t.qualifyPerGroup){
    const qualifiers = [];
    t.groupData.forEach(g=>{
      const sorted = [...g.players].sort((a,b)=> b.points-a.points || (b.gf-b.ga)-(a.gf-a.ga));
      for(let i=0;i<t.qualifyPerGroup && i<sorted.length;i++){
        qualifiers.push({playerId: sorted[i].playerId, group: g.name, seed: i+1, points: sorted[i].points, gd: sorted[i].gf-sorted[i].ga});
      }
    });

    if(qualifiers.length >= 2){
      const N = t.qualifyPerGroup;
      const round1 = [];

      qualifiers.forEach((q,gi)=>{
        const groupQualifiers = qualifiers.filter(x=>x.group===q.group);
        for(let i=0;i<Math.floor(N/2);i++){
          const top = groupQualifiers[i];
          const bottom = groupQualifiers[N-1-i];
          if(top && bottom){
            round1.push({
              id: uid(),
              team1: top.playerId,
              team2: bottom.playerId,
              score1: null, score2: null,
              leg2Score1: null, leg2Score2: null,
              winner: null,
              round: 'Round 1',
              label: `Group ${top.group} ${top.seed} vs Group ${bottom.group} ${bottom.seed}`
            });
          }
        }
        if(N % 2 === 1){
          const middle = groupQualifiers[Math.floor(N/2)];
          if(middle){
            round1.push({
              id: uid(),
              team1: middle.playerId,
              team2: null,
              score1: null, score2: null,
              winner: middle.playerId,
              round: 'Round 1',
              label: `Group ${middle.group} ${middle.seed} (Bye)`,
              isBye: true
            });
          }
        }
      });

      t.knockoutBracket = buildFullBracketFromR1(round1);
      t.knockoutDrawn = true;
    }
  }

  DB.set('tournaments', tourneys);
}

function buildFullBracketFromR1(round1){
  const rounds = [round1];
  let currentRound = round1.filter(m=>!m.isBye);
  let currentByes = round1.filter(m=>m.isBye).map(m=>m.winner);

  while(currentRound.length > 1 || currentByes.length > 1){
    const nextRound = [];
    const winners = [...currentByes];

    for(let i=0;i<currentRound.length;i+=2){
      const m1 = currentRound[i];
      const m2 = currentRound[i+1];
      nextRound.push({
        id: uid(),
        team1: m1?.winner || null,
        team2: m2?.winner || null,
        score1: null, score2: null,
        leg2Score1: null, leg2Score2: null,
        winner: null,
        round: 'next',
        label: 'Winner advances'
      });
    }

    if(currentRound.length % 2 === 1 && currentByes.length > 0){
      const bye = currentByes.shift();
      if(nextRound.length > 0){
        const last = nextRound[nextRound.length-1];
        if(!last.team2) last.team2 = bye;
      }
    }

    if(nextRound.length === 0) break;
    rounds.push(nextRound);
    currentRound = nextRound.filter(m=>!m.isBye);
    currentByes = nextRound.filter(m=>m.isBye).map(m=>m.winner);
  }

  // Label rounds
  const totalTeams = round1.length;
  const labels = [];
  let size = totalTeams;
  while(size >= 2){
    if(size === 2) labels.push('Final');
    else if(size === 4) labels.push('Semi Finals');
    else if(size === 8) labels.push('Quarter Finals');
    else if(size === 16) labels.push('Round of 16');
    else labels.push('Round of ' + size);
    size = Math.ceil(size / 2);
  }
  labels.reverse();
  rounds.forEach((r,i)=>{
    const lbl = labels[i] || ('Round '+(i+1));
    r.forEach(m=>{ if(m.round === 'next' || m.round === 'Round 1') m.round = lbl; });
  });

  return rounds;
}

/* =========================
   SINGLE ELIMINATION
   ========================= */
function drawSingleElim(tid){
  const tourneys = DB.get('tournaments');
  const t = tourneys.find(x=>x.id===tid);
  const regs = t.registrations || [];
  if(regs.length<2){ toast('Need at least 2 players', true); return }

  let bracketSize = nextPow2(regs.length);
  const shuffled = [...regs].sort(()=>Math.random()-0.5);
  while(shuffled.length < bracketSize) shuffled.push(null);

  const round1 = [];
  for(let i=0;i<bracketSize;i+=2){
    const t1 = shuffled[i];
    const t2 = shuffled[i+1];
    round1.push({
      id: uid(),
      team1: t1?.playerId || null,
      team2: t2?.playerId || null,
      score1: null, score2: null,
      winner: null,
      round: 'R1',
      label: t1 && t2 ? 'Match' : (t1?'BYE':'TBD')
    });
  }

  t.knockoutBracket = buildFullBracketFromR1(round1);
  t.knockoutDrawn = true;
  t.knockoutFormat = 'single';
  if(t.status === 'open' || t.status === 'draft') t.status = 'active';
  DB.set('tournaments', tourneys);
  renderTournamentDetail(tid);
  toast('Bracket drawn');
}

function saveFixtureScore(tid, fixtureIndex){
  const tourneys = DB.get('tournaments');
  const t = tourneys.find(x=>x.id===tid);
  const f = t.fixtures[fixtureIndex];

  const score1 = parseInt(document.getElementById('fs_score1').value)||0;
  const score2 = parseInt(document.getElementById('fs_score2').value)||0;

  f.score1 = score1;
  f.score2 = score2;
  f.played = true;

  // Update group standings
  const group = t.groupData.find(g=>g.name===f.group);
  if(group){
    const p1 = group.players.find(p=>p.playerId===f.team1);
    const p2 = group.players.find(p=>p.playerId===f.team2);

    if(p1 && p2){
      if(f.previousStats){
        p1.played -= f.previousStats.p1.played;
        p1.wins -= f.previousStats.p1.wins;
        p1.draws -= f.previousStats.p1.draws;
        p1.losses -= f.previousStats.p1.losses;
        p1.gf -= f.previousStats.p1.gf;
        p1.ga -= f.previousStats.p1.ga;
        p1.points -= f.previousStats.p1.points;

        p2.played -= f.previousStats.p2.played;
        p2.wins -= f.previousStats.p2.wins;
        p2.draws -= f.previousStats.p2.draws;
        p2.losses -= f.previousStats.p2.losses;
        p2.gf -= f.previousStats.p2.gf;
        p2.ga -= f.previousStats.p2.ga;
        p2.points -= f.previousStats.p2.points;
      }

      p1.played += 1;
      p1.gf += score1;
      p1.ga += score2;
      p2.played += 1;
      p2.gf += score2;
      p2.ga += score1;

      if(score1 > score2){
        p1.wins += 1;
        p1.points += 3;
        p2.losses += 1;
      } else if(score2 > score1){
        p2.wins += 1;
        p2.points += 3;
        p1.losses += 1;
      } else {
        p1.draws = (p1.draws||0) + 1;
        p1.points += 1;
        p2.draws = (p2.draws||0) + 1;
        p2.points += 1;
      }

      f.previousStats = {
        p1: {played:1, wins: score1>score2?1:0, draws: score1===score2?1:0, losses: score1<score2?1:0, gf:score1, ga:score2, points: score1>score2?3:score1===score2?1:0},
        p2: {played:1, wins: score2>score1?1:0, draws: score1===score2?1:0, losses: score2<score1?1:0, gf:score2, ga:score1, points: score2>score1?3:score1===score2?1:0}
      };
    }
  }

  DB.set('tournaments', tourneys);
  closeModal();
  renderTournamentDetail(tid);
  toast('Score updated');
}

            <div class="form-group"><label class="form-label">${getName(m.team2)}</label><input class="form-input" type="number" id="km_l2s2" value="${m.leg2Score2??''}" min="0"></div>
          </div>
        </div>
      `:''}

        <select class="form-select" id="km_winner">
          <option value="">Auto-calculate</option>
          <option value="${m.team1}" ${m.winner===m.team1?'selected':''}>${getName(m.team1)}</option>
          <option value="${m.team2}" ${m.winner===m.team2?'selected':''}>${getName(m.team2)}</option>
        </select>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveKnockoutMatch('${tid}',${roundIdx},'${matchId}')">Save</button>
    </div>
  `);

function saveKnockoutMatch(tid, roundIdx, matchId){
  const tourneys = DB.get('tournaments');
  const t = tourneys.find(x=>x.id===tid);
  const m = t.knockoutBracket[roundIdx].find(x=>x.id===matchId);
  const s1 = document.getElementById('km_s1').value;
  const s2 = document.getElementById('km_s2').value;
  m.score1 = s1===''?null:+s1;
  m.score2 = s2===''?null:+s2;
  const l2s1 = document.getElementById('km_l2s1');
  const l2s2 = document.getElementById('km_l2s2');
  if(l2s1){ m.leg2Score1 = l2s1.value===''?null:+l2s1.value }
  if(l2s2){ m.leg2Score2 = l2s2.value===''?null:+l2s2.value }

  const manual = document.getElementById('km_winner').value;
  if(manual){
    m.winner = manual;
  } else {
    if(m.score1!==null && m.score2!==null){
      if(t.knockoutFormat==='2leg' && m.leg2Score1!==null && m.leg2Score2!==null){
        const agg1 = m.score1 + m.leg2Score1;
        const agg2 = m.score2 + m.leg2Score2;
        m.winner = agg1>agg2 ? m.team1 : (agg2>agg1 ? m.team2 : null);
      } else {
        m.winner = m.score1>m.score2 ? m.team1 : (m.score2>m.score1 ? m.team2 : null);
      }
    }
  }

  if(m.winner && t.knockoutBracket[roundIdx+1]){
    const nextRound = t.knockoutBracket[roundIdx+1];
    const matchIndex = t.knockoutBracket[roundIdx].indexOf(m);
    const nextMatchIdx = Math.floor(matchIndex/2);
    if(nextRound[nextMatchIdx]){
      const slot = matchIndex%2===0 ? 'team1' : 'team2';
      nextRound[nextMatchIdx][slot] = m.winner;
    }
  }

  DB.set('tournaments', tourneys);
  closeModal();
  renderTournamentDetail(tid);
  toast('Match updated · Leaderboard live');
}

function openCompleteTournamentModal(tid){
  if(!isAdmin()){ toast('Admin login required', true); return }
  const t = DB.get('tournaments').find(x=>x.id===tid);
  const players = DB.get('players');

  let championCands = [], runnerUpCands = [], thirdCands = [];
  if(t.format==='group_knockout' || t.format==='single_elimination'){
    const final = t.knockoutBracket[t.knockoutBracket.length-1]?.[0];
    if(final?.winner) championCands = [final.winner];
    if(final){
      const loser = final.winner===final.team1 ? final.team2 : final.team1;
      if(loser) runnerUpCands = [loser];
    }
    if(t.knockoutBracket.length>=2){
      const semis = t.knockoutBracket[t.knockoutBracket.length-2];
      semis.forEach(m=>{
        if(m.winner){
          const loser = m.winner===m.team1 ? m.team2 : m.team1;
          if(loser && !thirdCands.includes(loser)) thirdCands.push(loser);
        }
      });
    }
  } else if(t.format==='league'){
    const sorted = [...t.groupData[0].players].sort((a,b)=> b.points-a.points || (b.gf-b.ga)-(a.gf-a.ga));
    if(sorted[0]) championCands = [sorted[0].playerId];
    if(sorted[1]) runnerUpCands = [sorted[1].playerId];
    if(sorted[2]) thirdCands = [sorted[2].playerId];
  }

  const allPlayers = players.filter(p=>(t.registrations||[]).some(r=>r.playerId===p.id));

  openModal(`
    <div class="modal-head">
      <div class="modal-title">🏆 Complete Tournament</div>
      <button class="btn btn-ghost btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">🥇 Champion</label>
        <select class="form-select" id="ct_champ">
          <option value="">— Select —</option>
          ${allPlayers.map(p=>`<option value="${p.id}" ${championCands.includes(p.id)?'selected':''}>${p.name}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">🥈 Runner-up</label>
        <select class="form-select" id="ct_runner">
          <option value="">— Select —</option>
          ${allPlayers.map(p=>`<option value="${p.id}" ${runnerUpCands.includes(p.id)?'selected':''}>${p.name}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">🥉 Third Place</label>
        <select class="form-select" id="ct_third">
          <option value="">— Select —</option>
          ${allPlayers.map(p=>`<option value="${p.id}" ${thirdCands.includes(p.id)?'selected':''}>${p.name}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="completeTournament('${tid}')">Complete Tournament</button>
    </div>
  `);
}

function completeTournament(tid){
  const tourneys = DB.get('tournaments');
  const t = tourneys.find(x=>x.id===tid);
  t.champion = document.getElementById('ct_champ').value || null;
  t.runnerUp = document.getElementById('ct_runner').value || null;

function getPlayerFixtures(t, playerId){
  const fixtures = [];
  if(t.knockoutBracket){
    t.knockoutBracket.forEach((round,ri)=>{
      round.forEach(m=>{
        if(m.isBye) return;
        if(m.team1===playerId || m.team2===playerId){
          fixtures.push({
            stage: m.round || `Round ${ri+1}`,
            team1: m.team1, team2: m.team2,
            score1: m.score1, score2: m.score2,
            winner: m.winner,
            stageType: 'knockout'
          });
        }
      });
    });
  }
  if(t.fixtures){
    t.fixtures.forEach(f=>{
      if(f.team1===playerId || f.team2===playerId){
        fixtures.push({
          stage: `Group ${f.group}`,
          team1: f.team1, team2: f.team2,
          score1: f.score1, score2: f.score2,
          winner: f.score1>f.score2?f.team1:(f.score2>f.score1?f.team2:null),
          stageType: 'group'
        });
      }
    });
  }
  return fixtures;
}

function getPlayerTournamentStats(t, playerId){
  let matches=0, wins=0, gf=0, ga=0;
  if(t.groupData){
    t.groupData.forEach(g=>{
      const row = g.players.find(r=>r.playerId===playerId);
      if(row){ matches+=row.played; wins+=row.wins; gf+=row.gf; ga+=row.ga; }
    });
  }
  if(t.knockoutBracket){
    t.knockoutBracket.forEach(round=>{
      round.forEach(m=>{
        if(m.isBye) return;
        if(m.team1===playerId || m.team2===playerId){
          if(m.score1!==null && m.score1!==undefined){
            matches++;
            if(m.winner===playerId) wins++;
            if(m.team1===playerId){ gf+=m.score1; ga+=m.score2; }
            else { gf+=m.score2; ga+=m.score1; }
          }
        }
      });
    });
  }
  return {matches, wins, gf, ga};
}

function switchTab(el, tabId){
  el.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('#main > div[id^="tab-"]').forEach(d=>d.classList.add('hidden'));
  const target = document.getElementById(tabId);
  if(target) target.classList.remove('hidden');
}

                  <td><strong>${x.s.wins}</strong></td>
                  <td><span style="color:var(--primary);font-weight:700">${x.s.winPct}%</span></td>
                  <td>${x.s.tourneyWins>0 ? `<span class="badge badge-open"> ${x.s.tourneyWins}</span>` : '<span class="text-muted">0</span>'}</td>
                  <td>${x.s.tourneyRunnerUp>0 ? `<span class="text-primary">${x.s.tourneyRunnerUp}</span>` : '<span class="text-muted">0</span>'}</td>
                  <td>${x.s.tourneyThird>0 ? `<span style="color:#cd7f32">${x.s.tourneyThird}</span>` : '<span class="text-muted">0</span>'}</td>
                </tr>
              `).join('')
            }
          </tbody>
        </table>
      </div>
    </div>
  `;
}

/* =========================
   ADMIN PORTAL
   ========================= */
function renderAdmin(){
  const session = DB.get('session');
  if(!session){
    document.getElementById('main').innerHTML = `
      <div class="login-wrap">
        <div class="login-card">
          <div class="login-brand">
            <div class="brand-icon">M</div>
            <h1>Admin Portal</h1>
            <p>Sign in to manage the community database</p>
          </div>
          <div class="form-group">
            <label class="form-label">Username</label>
            <input class="form-input" id="admin_user" placeholder="Username">
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input class="form-input" type="password" id="admin_pass" placeholder="Password" onkeydown="if(event.key==='Enter')adminLogin()">
          </div>
          <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="adminLogin()">Sign In</button>
          <div class="text-xs text-muted" style="text-align:center;margin-top:16px">Default: admin / milandhoo2026</div>
        </div>
      </div>
    `;
    return;
  }

  const players = DB.get('players');
  const tourneys = DB.get('tournaments');
  const admin = DB.get('admin');

  document.getElementById('main').innerHTML = `
    <div class="topbar">
      <div>
        <div class="page-title">Admin Panel</div>
        <div class="page-sub">Signed in as <strong>${session.username}</strong> · Full control over the community</div>
      </div>
      <div class="top-actions">
        <span class="admin-indicator">Admin Mode</span>
        <button class="btn btn-secondary" onclick="exportData()">📥 Export</button>
        <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()"> Import</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
        <button class="btn btn-danger" onclick="adminLogout()">Sign Out</button>
      </div>
    </div>

    <div class="grid grid-3">
      <div class="card" onclick="navigate('players')" style="cursor:pointer">
        <div class="card-title">👥 Manage Players</div>
        <div class="stat-value" style="margin-top:16px">${players.length}</div>
        <div class="text-sm text-muted">Add, edit, delete player profiles with photos</div>
      </div>
      <div class="card" onclick="navigate('tournaments')" style="cursor:pointer">
        <div class="card-title"> Manage Tournaments</div>
        <div class="stat-value" style="margin-top:16px">${tourneys.length}</div>
        <div class="text-sm text-muted">Create, edit, run tournaments</div>
      </div>
      <div class="card" onclick="openChangePassword()" style="cursor:pointer">
        <div class="card-title">🔐 Security</div>
        <div class="text-sm text-muted" style="margin-top:16px">Change admin password</div>
        <div class="text-xs text-muted" style="margin-top:8px">Current: ${admin.username}</div>
      </div>
    </div>

    <div class="card mt-24">
      <div class="card-head"><div class="card-title">⚡ Quick Actions</div></div>
      <div class="flex gap-8" style="flex-wrap:wrap">
        <button class="btn btn-primary" onclick="openCreateTournament()">+ New Tournament</button>
        <button class="btn btn-secondary" onclick="openPlayerModal()">+ New Player</button>
        <button class="btn btn-secondary" onclick="navigate('leaderboard')">View Leaderboard</button>
      </div>
    </div>
  `;
}

function adminLogin(){
  const u = document.getElementById('admin_user').value.trim();
  const p = document.getElementById('admin_pass').value;
  const admin = DB.get('admin');
  if(u===admin.username && p===admin.password){
    DB.set('session', {username:u, at:new Date().toISOString()});
    toast('Welcome back, admin');
    renderAdmin();
  } else {
    toast('Invalid credentials', true);
  }
}

function adminLogout(){
  DB.set('session', null);
  toast('Signed out');
  renderAdmin();
}

function openChangePassword(){
  openModal(`
    <div class="modal-head">
      <div class="modal-title">Change Admin Password</div>
      <button class="btn btn-ghost btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Current Password</label><input class="form-input" type="password" id="cp_old"></div>
      <div class="form-group"><label class="form-label">New Password</label><input class="form-input" type="password" id="cp_new"></div>
      <div class="form-group"><label class="form-label">Confirm New Password</label><input class="form-input" type="password" id="cp_conf"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="changePassword()">Update Password</button>
    </div>
  `);
}

function changePassword(){
  const admin = DB.get('admin');
  const old = document.getElementById('cp_old').value;
  const np = document.getElementById('cp_new').value;
  const conf = document.getElementById('cp_conf').value;
  if(old!==admin.password){ toast('Current password is wrong', true); return }
  if(np.length<4){ toast('Password too short', true); return }
  if(np!==conf){ toast('Passwords do not match', true); return }
  admin.password = np;
  DB.set('admin', admin);
  closeModal();
  toast('Password updated');
}

function exportData(){
  const data = {
    players: DB.get('players'),
    tournaments: DB.get('tournaments'),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `milandhoo-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Data exported');
}

function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(data.players) DB.set('players', data.players);
      if(data.tournaments) DB.set('tournaments', data.tournaments);
      toast('Data imported successfully');
      navigate(currentView);
    } catch { toast('Invalid file', true) }
  };
  reader.readAsText(file);
}

/* Init */
navigate('dashboard');

// Check deadlines periodically
setInterval(()=>{
  const tourneys = DB.get('tournaments');
  tourneys.forEach(t=>{
    if(t.status==='active' && t.groupDeadline && !t.deadlineProcessed){
      if(new Date(t.groupDeadline) < new Date()){
        if(t.fixtures){
          t.fixtures.forEach(f=>{
            if(f.score1===null || f.score1===undefined){
              f.score1 = 0;
              f.score2 = 0;
              f.played = true;

              const group = t.groupData?.find(g=>g.name===f.group);
              if(group){
                const p1 = group.players.find(p=>p.playerId===f.team1);
                const p2 = group.players.find(p=>p.playerId===f.team2);
                if(p1 && p2){
                  p1.played += 1;
                  p1.draws = (p1.draws||0) + 1;
                  p1.points += 1;
                  p2.played += 1;
                  p2.draws = (p2.draws||0) + 1;
                  p2.points += 1;
                }
              }
            }
          });
        }
        t.deadlineProcessed = true;
        DB.set('tournaments', tourneys);
        if(currentView==='tournament-detail' && currentTournamentId===t.id){
          renderTournamentDetail(t.id);
        }
        toast('Group stage deadline processed');
      }
    }
  });
}, 30000);
</script>
